name: Pages

# Builds the interactive results page from the committed aggregate tables in results/,
# so the page can never drift from the numbers in the paper.
on:
  push:
    branches: [main]
    paths: [site/**, results/**, scripts/make_blog_*.py, scripts/figure_data.py]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate data and figures
        run: |
          uv run python scripts/make_blog_data.py
          uv run --with matplotlib python scripts/make_blog_figures.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
