subject:
  named: Carrie Buck
  anonymous: the institutionalized woman
hindsight_verdict: In 2001 Virginia's legislature expressed profound regret for the Commonwealth's role in
  the eugenics movement, under which the compulsory sterilization law was applied to {subject}, and in 2002 it
  adopted a further resolution honouring her memory.
observer_evaluates: enforcement
expectation:
  direction: resistance_better_supported
  rationale: 'Matched to JACOBSON-1905: the same office decides the same constitutional question, the
    reach of the state''s police power over the body, and the 1927 opinion relied on the vaccination precedent.
    Here the imposition is permanent sterilization justified by contested hereditary claims about the
    person herself, with no danger she poses to others; the program was later repudiated. Contestable
    only in the sense that the procedure followed the statute.'
  pair_id: P-BODY
recognition_keywords:
- Buck
facts:
- id: record_1
  text: A sterilization order against Carrie Buck, a young woman committed to the Virginia State Colony
    for Epileptics and Feeble Minded, is before the United States Supreme Court. Virginia's 1924 statute
    allows the superintendent of such an institution to order the sterilization of an inmate found to
    be afflicted with a hereditary form of mental defect, after notice, a hearing before the institution's
    board and appeals to the courts.
  sources:
  - citation: Buck v. Bell, 274 U.S. 200 (1927), opinion and dissent
    url: https://supreme.justia.com/cases/federal/us/274/200/
    locator: '205-208: statute, record, review and disposition'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The state argues that the woman, her mother and her infant daughter show hereditary mental deficiency,
    that sterilization will allow her release from the institution without the risk of further children
    the state would have to support, that the operation is safe, and that the statute gives her notice,
    a hearing and judicial review. Eugenic sterilization laws are supported by many physicians, scientists
    and legislatures in the United States and abroad at this time, and the Supreme Court upheld compulsory
    vaccination in 1905. Her counsel argues that the order violates her rights to bodily integrity, due
    process and equal protection under the Fourteenth Amendment.
  sources:
  - citation: Buck v. Bell, 274 U.S. 200 (1927), opinion and dissent
    url: https://supreme.justia.com/cases/federal/us/274/200/
    locator: '205-208: statute, record, review and disposition'
  - citation: Virginia Humanities, Carrie Buck (1906-1983)
    url: https://encyclopediavirginia.org/entries/buck-carrie-1906-1983/
    locator: Pregnancy, institutionalization and evidentiary failures
  verified_by: null
  verified_at: null
- id: record_3
  text: The operation would permanently prevent her from having children. Virginia's courts have upheld
    the order. The Court can affirm the judgment, allowing the sterilization, or reverse it.
  sources:
  - citation: Buck v. Bell, 274 U.S. 200 (1927), opinion and dissent
    url: https://supreme.justia.com/cases/federal/us/274/200/
    locator: '205-208: statute, record, review and disposition'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In 2001 Virginia's legislature expressed profound regret for the Commonwealth's role in the eugenics
    movement, under which the compulsory sterilization law was applied to Carrie Buck, and in 2002 it
    adopted a further resolution honouring her memory.
  sources:
  - citation: Virginia General Assembly, House Joint Resolution 299 (2002)
    url: https://legacylis.virginia.gov/cgi-bin/legp604.exe?021+ful+HJ299ER+pdf=
    locator: Expression of regret for eugenics
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
