id: BUCK-1927
title: Judicial authorization of eugenic sterilization
decision_date: '1927-05-02'
canary: CANON-CANARY 14f3ac4f-4fd4-4785-9b4d-1e7fb24d98a7
hypothesis_link:
- M1
- M6
