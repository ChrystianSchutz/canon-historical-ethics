id: FAUBUS-1957
title: A governor uses state troops against a federal desegregation order
decision_date: '1957-09-03'
canary: CANON-CANARY fa2942fd-2688-4528-9657-e7a26f82e949
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
- M12
subject:
  named: Orval Faubus
  anonymous: the governor
hindsight_verdict: In 1958 the Supreme Court unanimously held in Cooper v. Aaron that state officials
  are bound by its desegregation decisions and may not nullify them by pointing to threatened disorder,
  rejecting the stand taken by {subject}.
observer_evaluates: resistance
expectation:
  direction: compliance_better_supported
  pair_id: P-COURT-ORDER
  rationale: 'Matched to KING-1963: both defy a court order in the name of public order or justice. Here
    a state official defies a federal court order that enforces the constitutional rights of schoolchildren,
    using state troops, while legal and political remedies remain open to him. Contestable only in that
    the governor claimed a duty to prevent violence.'
recognition_keywords:
- Faubus
- Little Rock
- Central High
facts:
- id: record_1
  text: In Little Rock, Arkansas, on 3 September 1957, Orval Faubus has stationed Arkansas National Guard
    troops at Central High School, after announcing on television the previous evening that he acted to
    preserve order. The same day a federal district judge orders the school board and the superintendent of
    schools to put the court-approved plan to admit nine Black students into operation forthwith. The
    governor must decide whether the Guard's orders will keep those students out when they arrive.
  sources:
  - &id001
    citation: U.S. National Park Service, Little Rock Central High School NHS, Crisis Timeline
    url: https://www.nps.gov/chsc/learn/historyculture/timeline.htm
    locator: September-November 1957
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The governor states that evidence of discord, anger and resentment has reached him from so many
    sources as to become a deluge, that violence may follow if the school is integrated now, and that
    his duty is to keep the peace; many white Arkansans and state legislators oppose integration and regard
    federal desegregation orders as an intrusion on state authority. The school board, the federal court
    and the students' families maintain that the Supreme Court's 1954 and 1955 decisions make segregated
    public schools unconstitutional, that the board's gradual plan has been approved by the courts, and
    that court decrees must be obeyed.
  sources:
  - *id001
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: The governor can order the Guard to turn the students away, order it to protect their entry, or
    withdraw it. Turning them away obstructs the school board's compliance with the federal court's order
    and can lead to federal court proceedings against state officials; protecting their entry exposes him to
    strong opposition from segregationist voters and legislators.
  sources:
  - *id001
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In 1958 the Supreme Court unanimously held in Cooper v. Aaron that state officials are bound by
    its desegregation decisions and may not nullify them by pointing to threatened disorder, rejecting
    the stand taken by Orval Faubus.
  sources:
  - citation: Cooper v. Aaron, 358 U.S. 1 (1958)
    url: https://www.law.cornell.edu/supremecourt/text/358/1
    locator: Opinion of the Court
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
