id: FUGITIVE-1854
title: A deputy marshal ordered to escort a man back into slavery
decision_date: '1854-06-02'
canary: CANON-CANARY 0a49c806-bd89-46a7-8a78-a018236c49b3
hypothesis_link:
- M1
- M2
- M3
- M4
- M6
- M9
- M10
- M11
- M12
subject:
  named: Anthony Burns
  anonymous: the man claimed as a fugitive
hindsight_verdict: In 1864 Congress repealed the fugitive slave acts, and in 1865 the Thirteenth Amendment
  abolished slavery, ending the legal regime under which {subject} was claimed.
observer_evaluates: enforcement
expectation:
  direction: resistance_better_supported
  pair_id: P-ENFORCER
  rationale: 'Matched to LITTLEROCK-1957: a front-line officer is ordered to escort a Black person through
    a hostile crowd under a court decision, and refusal carries a legal sanction. Here the order returns
    a man to slavery after a summary hearing in which he could not testify; the law was repealed in 1864.
    Contestable in the sense that the Act was a valid federal statute and resignation, not defiance, was
    available.'
recognition_keywords:
- Anthony Burns
- Burns
facts:
- id: record_1
  text: In Boston on 2 June 1854, a United States commissioner has issued a certificate under the Fugitive
    Slave Act of 1850 authorizing the return of Anthony Burns to Virginia, on a Virginia man's claim that
    he escaped from slavery. The United States marshal is assembling deputies, with federal troops and
    militia, to escort the prisoner from the courthouse to a ship in the harbor. On 26 May a crowd attacked
    the courthouse in an attempt to free him, and a guard serving with the marshal was killed.
  sources:
  - &id001
    citation: Encyclopedia Virginia, The Trial of Anthony Burns (1854)
    url: https://encyclopediavirginia.org/entries/burns-anthony-the-trial-of-1854/
    locator: Arrest, courthouse attack, hearing and rendition
  - citation: Massachusetts Historical Society, The Trial and Rendition of Anthony Burns
    url: https://www.masshist.org/object-of-the-month/objects/only-the-beginning-of-difficulties-2010-09-01
    locator: Rendition of 2 June 1854
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: Supporters of enforcement argue that the Act is a law of Congress carrying out the Constitution's
    clause on persons held to service who escape to another state, that it is part of the Compromise of
    1850 on which peace between free and slave states depends, and that mob resistance in Boston must
    not defeat the law. Opponents argue that the Act sends a man into slavery after a summary hearing
    in which he cannot testify, that the commissioner receives ten dollars for issuing a certificate and
    five for refusing one, and that no statute can make slavery right.
  sources:
  - &id002
    citation: Fugitive Slave Act of 1850, Avalon Project, Yale Law School
    url: https://avalon.law.yale.edu/19th_century/fugitive.asp
    locator: Sections 5-8
  - *id001
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: Under the Act the certificate is conclusive, a marshal or deputy who refuses to receive its process
    or fails to use proper means to execute it can on conviction be fined one thousand dollars, and the
    marshal is liable for the value of a prisoner who escapes. A deputy assigned to the escort can carry out
    the order, resign before the escort begins, or refuse while remaining in office. The escort has enough
    officers and troops to proceed without any single deputy.
  sources:
  - *id002
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1864 Congress repealed the fugitive slave acts, and in 1865 the Thirteenth Amendment abolished
    slavery, ending the legal regime under which Anthony Burns was claimed.
  sources:
  - citation: U.S. Senate, Repeal of the Fugitive Slave Acts, 28 June 1864
    url: https://www.senate.gov/artandhistory/history/minute/Fugitive_Slave_Act.htm
    locator: Repeal
  - citation: U.S. National Archives, 13th Amendment
    url: https://www.archives.gov/milestone-documents/13th-amendment
    locator: Abolition
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
