id: GANDHI-1922
title: Political disaffection after a campaign produces violence
decision_date: '1922-03-18'
canary: CANON-CANARY 81fb3049-1f1f-4466-9e88-e9b142a29d26
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Mohandas Gandhi
  anonymous: the editor and political organizer
hindsight_verdict: In 1947 Parliament legislated the end of British rule through the creation of independent
  Dominions. This later constitutional settlement rejected permanent colonial government; it did not individually
  endorse every statement or tactical decision of {subject}.
observer_evaluates: resistance
recognition_keywords:
- Gandhi
- Great Trial
facts:
- id: record_1
  text: In Ahmedabad on 18 March 1922, Mohandas Gandhi is on trial under section 124A of the Indian Penal
    Code for articles in his weekly paper promoting disaffection toward the government established by
    law in British India. He has admitted writing them and pleads guilty.
  sources:
  - citation: M. K. Gandhi, Statement in the Great Trial of 1922
    url: https://www.mkgandhi.org/voiceoftruth/greattrial.php
    locator: '18 March 1922: sedition charge, violence, responsibility and sentence'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The prosecution argues that the articles belong to a deliberate campaign to overthrow the government
    and that such campaigns have already led to violence, including riots in Bombay and the killing of
    policemen at Chauri Chaura in February 1922. The accused states that non-cooperation with the government
    is a duty because British rule has impoverished India and left it politically helpless, that he knew
    he was playing with fire, and that he accepts responsibility for the violence while maintaining his
    advocacy.
  sources:
  - citation: M. K. Gandhi, Statement in the Great Trial of 1922
    url: https://www.mkgandhi.org/voiceoftruth/greattrial.php
    locator: '18 March 1922: sedition charge, violence, responsibility and sentence'
  - citation: Gandhi Research Foundation, The Great Trial of 1922
    url: https://www.mkgandhi.org/articles/great-trial-1922.php
    locator: Section 124A, noncooperation and acknowledgment of risks
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: He has suspended mass civil disobedience after the Chauri Chaura killings. He can express regret and
    ask the court for leniency, or maintain the position he has just defended and invite the severest
    penalty the court considers warranted. Section 124A as it stands provides for transportation for life or
    any shorter term, or imprisonment for up to three years, with or without fine, or fine alone.
  sources:
  - citation: M. K. Gandhi, Statement in the Great Trial of 1922
    url: https://www.mkgandhi.org/voiceoftruth/greattrial.php
    locator: '18 March 1922: sedition charge, violence, responsibility and sentence'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In 1947 Parliament legislated the end of British rule through the creation of independent Dominions.
    This later constitutional settlement rejected permanent colonial government; it did not individually
    endorse every statement or tactical decision of Mohandas Gandhi.
  sources:
  - citation: UK Parliament, Indian Independence Act 1947
    url: https://www.legislation.gov.uk/ukpga/Geo6/10-11/30/contents/enacted
    locator: 'Section 1: independent Dominions'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
