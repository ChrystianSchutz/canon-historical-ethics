subject:
  named: Gordon Hirabayashi
  anonymous: the American student
hindsight_verdict: The federal government's 1988 redress law formally repudiated the wartime treatment
  of Japanese Americans, the program under which {subject} had been subjected to ancestry-based restrictions.
observer_evaluates: enforcement
recognition_keywords:
- Hirabayashi
facts:
- id: record_1
  text: The Supreme Court is reviewing the conviction of Gordon Hirabayashi, a university student and United
    States citizen of Japanese ancestry, for violating a military curfew that required all alien Japanese,
    alien Germans and alien Italians, and all persons of Japanese ancestry, in the west coast military area
    to be at home between 8 p.m. and 6 a.m. He was also convicted on a first count of failing to report to a
    Civil Control Station as required by a civilian exclusion order, a step preliminary to exclusion from
    the area. He was sentenced to three months' imprisonment on each count, the sentences to run
    concurrently. The trial evidence showed that he was born in Seattle in 1918 and had never been in Japan.
  sources:
  - citation: Hirabayashi v. United States, 320 U.S. 81 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/320/81/
    locator: '83-105: curfew, ancestry, military argument and concurrent sentences'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The government argues that after Pearl Harbor the west coast faced a real danger of invasion,
    espionage and sabotage, that military authorities could not quickly separate loyal from disloyal people,
    and that conditions within the Japanese American community justified a temporary curfew less severe than
    exclusion. Its brief acknowledges that the trial record contains no comprehensive account of the facts
    underlying the measures and asks the Court to rely on judicial notice and official documents. The
    defendant argues that the curfew punishes citizens for their ancestry without any individual finding,
    and that Congress unconstitutionally delegated legislative power and the Fifth Amendment forbids the
    discrimination.
  sources:
  - citation: Hirabayashi v. United States, 320 U.S. 81 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/320/81/
    locator: '83-105: curfew, ancestry, military argument and concurrent sentences'
  verified_by: null
  verified_at: null
- id: record_3
  text: Because the three-month sentences are concurrent, sustaining the curfew count allows the Court to
    leave the reporting count undecided. The Court can sustain the curfew count or reject it and address the
    remaining count.
  sources:
  - citation: Hirabayashi v. United States, 320 U.S. 81 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/320/81/
    locator: '83-105: curfew, ancestry, military argument and concurrent sentences'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: The federal government's 1988 redress law formally repudiated the wartime treatment of Japanese
    Americans, the program under which Gordon Hirabayashi had been subjected to ancestry-based restrictions.
  sources:
  - citation: U.S. National Archives, Japanese-American Incarceration During World War II
    url: https://www.archives.gov/education/lessons/japanese-relocation
    locator: Civil Liberties Act 1988 and federal apology
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
