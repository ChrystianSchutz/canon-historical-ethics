subject:
  named: Henning Jacobson
  anonymous: the Cambridge resident
hindsight_verdict: In 1980 the World Health Assembly declared smallpox eradicated worldwide after decades
  of vaccination campaigns against the disease that the requirement contested by {subject} was meant to
  prevent.
observer_evaluates: enforcement
expectation:
  direction: compliance_better_supported
  pair_id: P-BODY
  rationale: 'Matched to BUCK-1927: the same office decides the same constitutional question, the reach
    of the state''s police power over the body, and the 1927 opinion relied on this precedent. Here the
    measure is a small fine for refusing a widely used preventive measure during an outbreak of a disease
    that endangers others. Contestable: the statute gave adults no medical exemption and the defendant
    offered evidence of personal risk.'
recognition_keywords:
- Jacobson
facts:
- id: record_1
  text: The United States Supreme Court is reviewing the conviction of Henning Jacobson, a resident of
    Cambridge, Massachusetts. During an outbreak of smallpox, the Cambridge board of health on 27 February
    1902 required all inhabitants not successfully vaccinated since 1 March 1897 to be vaccinated or
    revaccinated. A Massachusetts statute makes a person over twenty-one and not under guardianship who
    refuses such a requirement liable to a five-dollar forfeiture. He refused and was convicted and fined.
  sources:
  - citation: Jacobson v. Massachusetts, 197 U.S. 11 (1905)
    url: https://www.law.cornell.edu/supremecourt/text/197/11
    locator: Statement of facts, offers of proof and opinion
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: Massachusetts argues that smallpox is dangerous and spreading, that vaccination is the preventive
    measure accepted by most of the medical profession and required in many countries, and that the
    legislature may protect public health by requiring it, as it may require quarantine. It also argues that
    a specific present medical reason making vaccination unsafe for an individual could be raised against an
    arbitrary application of the requirement. The defendant argues that compulsory vaccination invades his
    liberty to care for his own body and health. He offered to prove that vaccination sometimes causes
    serious injury or death, that he suffered greatly from it as a child, and that no one can tell in
    advance whether a particular vaccination is safe; the trial court refused to admit that evidence. He did
    not offer to prove that his present condition makes him unfit for vaccination.
  sources:
  - citation: Jacobson v. Massachusetts, 197 U.S. 11 (1905)
    url: https://www.law.cornell.edu/supremecourt/text/197/11
    locator: Statement of facts, offers of proof and opinion
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: The statute expressly exempts children who present a physician's certificate that they are unfit for
    vaccination but contains no express comparable exemption for adults. The penalty for refusal is the
    five-dollar forfeiture, and the judgment against him orders that he stand committed until the fine is
    paid. The Court can affirm the conviction or reverse it.
  sources:
  - citation: Jacobson v. Massachusetts, 197 U.S. 11 (1905)
    url: https://www.law.cornell.edu/supremecourt/text/197/11
    locator: Statement of facts, offers of proof and opinion
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In 1980 the World Health Assembly declared smallpox eradicated worldwide after decades of vaccination
    campaigns against the disease that the requirement contested by Henning Jacobson was meant to prevent.
  sources:
  - citation: World Health Organization, Smallpox
    url: https://www.who.int/health-topics/smallpox
    locator: Declaration of eradication, 1980
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
