  text: On 12 April 1963 in Birmingham, Alabama, {subject} is deciding whether to lead a march on Good
    Friday. On 10 April a state circuit court, at the city's request and without hearing the organizers,
    issued an injunction forbidding demonstrations without a city permit. In the week before Good Friday
    campaign representatives sought permission to parade, picket and demonstrate and the commissioner
    refused; no further parade permit has been applied for since the injunction issued.
  fact_ids:
  - record_1
- id: authority
  text: City officials argue that the demonstrations threaten public order, that the permit ordinance
    and the injunction are lawful, and that anyone who objects must obey the court's order while challenging
    it through the courts. Local white clergy urge negotiation and legal action instead of street protest.
    The organizer argues that Birmingham's segregation laws violate the Constitution and human dignity,
    that legal challenges have repeatedly been delayed, and that the injunction misuses the courts to
    block peaceful protest.
  fact_ids:
  - record_2
- id: consequences
  text: He can ask the court to dissolve the injunction, with no assurance that effective relief can be
    obtained before the planned Good Friday march, or march while it is in force and face arrest and
    punishment for contempt. The planned march is nonviolent.
