id: KING-1963
title: A civil-rights march in defiance of a court injunction
decision_date: '1963-04-12'
canary: CANON-CANARY 1fefa878-e92b-4bbf-ac9c-e7906fc85efd
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
