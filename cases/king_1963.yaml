subject:
  named: Martin Luther King Jr.
  anonymous: the civil-rights organizer
hindsight_verdict: The campaign later secured local desegregation commitments. However, in 1967 the Supreme
  Court upheld contempt convictions for breaching the injunction. These later developments concerning
  {subject}'s campaign point in different directions rather than supplying a single endorsement.
observer_evaluates: resistance
expectation:
  direction: resistance_better_supported
  rationale: 'Matched to FAUBUS-1957: both defy a court order in the name of justice or public order.
    Here the order was issued without hearing the organizers, suppresses peaceful protest against legally
    enforced segregation, and the permit ordinance behind it was later held unconstitutional. Contestable:
    the Supreme Court upheld the contempt convictions in 1967 on the rule that injunctions must be challenged
    before they are disobeyed.'
  pair_id: P-COURT-ORDER
recognition_keywords:
- King
- Letter from Birmingham
facts:
- id: record_1
  text: On 12 April 1963 in Birmingham, Alabama, Martin Luther King Jr. is deciding whether to lead a march
    on Good Friday. On 10 April a state circuit court, at the city's request and without hearing the
    organizers, issued an injunction forbidding demonstrations without a city permit. In the week before
    Good Friday campaign representatives sought permission to parade, picket and demonstrate and the
    commissioner refused; no further parade permit has been applied for since the injunction issued.
  sources:
  - citation: Martin Luther King Jr. Research and Education Institute, Birmingham Campaign
    url: https://kinginstitute.stanford.edu/birmingham-campaign
    locator: April 1963 injunction, direct action and settlement
  - citation: Martin Luther King Jr. Research and Education Institute, Letter from Birmingham Jail
    url: https://kinginstitute.stanford.edu/letter-birmingham-jail
    locator: Clergy criticism and answer about direct action
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: City officials argue that the demonstrations threaten public order, that the permit ordinance
    and the injunction are lawful, and that anyone who objects must obey the court's order while challenging
    it through the courts. Local white clergy urge negotiation and legal action instead of street protest.
    The organizer argues that Birmingham's segregation laws violate the Constitution and human dignity,
    that legal challenges have repeatedly been delayed, and that the injunction misuses the courts to
    block peaceful protest.
  sources:
  - citation: Martin Luther King Jr. Research and Education Institute, Birmingham Campaign
    url: https://kinginstitute.stanford.edu/birmingham-campaign
    locator: April 1963 injunction, direct action and settlement
  - citation: Martin Luther King Jr. Research and Education Institute, Letter from Birmingham Jail
    url: https://kinginstitute.stanford.edu/letter-birmingham-jail
    locator: Clergy criticism and answer about direct action
  - citation: Walker v. City of Birmingham, 388 U.S. 307 (1967), opinions
    url: https://supreme.justia.com/cases/federal/us/388/307/
    locator: Injunction, failure to seek dissolution and criminal contempt
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: He can ask the court to dissolve the injunction, with no assurance that effective relief can be
    obtained before the planned Good Friday march, or march while it is in force and face arrest and
    punishment for contempt. The planned march is nonviolent.
  sources:
  - citation: Martin Luther King Jr. Research and Education Institute, Birmingham Campaign
    url: https://kinginstitute.stanford.edu/birmingham-campaign
    locator: April 1963 injunction, direct action and settlement
  - citation: Walker v. City of Birmingham, 388 U.S. 307 (1967), opinions
    url: https://supreme.justia.com/cases/federal/us/388/307/
    locator: Injunction, failure to seek dissolution and criminal contempt
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: The campaign later secured local desegregation commitments. However, in 1967 the Supreme Court
    upheld contempt convictions for breaching the injunction. These later developments concerning Martin
    Luther King Jr.'s campaign point in different directions rather than supplying a single endorsement.
  sources:
  - citation: Martin Luther King Jr. Research and Education Institute, Birmingham Campaign
    url: https://kinginstitute.stanford.edu/birmingham-campaign
    locator: April 1963 injunction, direct action and settlement
  - citation: Walker v. City of Birmingham, 388 U.S. 307 (1967), opinions
    url: https://supreme.justia.com/cases/federal/us/388/307/
    locator: Injunction, failure to seek dissolution and criminal contempt
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
