id: LITTLEROCK-1957
title: A federalized guardsman ordered to protect desegregation
decision_date: '1957-10-01'
canary: CANON-CANARY d46966cd-4929-4d08-a167-5ff32a4e0858
hypothesis_link:
- M1
- M2
- M3
