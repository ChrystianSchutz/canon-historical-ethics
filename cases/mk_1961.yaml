id: MK-1961
title: Beginning a sabotage campaign against apartheid institutions
decision_date: '1961-12-16'
canary: CANON-CANARY a85cc86d-74da-42d7-810d-c56ac2d78ad7
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Nelson Mandela
  anonymous: the opposition organizer
hindsight_verdict: South Africa's later constitutional settlement guaranteed equality and political participation
  irrespective of race. It rejected the political exclusion opposed by {subject}; it did not give blanket
  approval to every act of sabotage.
observer_evaluates: resistance
recognition_keywords:
- Mandela
- Umkhonto
facts:
- id: record_1
  text: In South Africa in late 1961, Nelson Mandela is a leader of a newly formed organization preparing
    to begin sabotage attacks on government installations. The African National Congress has been banned
    since 1960, Black South Africans cannot vote for Parliament, and police killed demonstrators at Sharpeville
    in 1960.
  sources:
  - citation: Nelson Mandela, statement from the dock, 20 April 1964
    url: https://sahistory.org.za/archive/court-transcript-statement-dock-nelson-mandela-pretoria-supreme-court-20-april-1964
    locator: Choice of sabotage, alternatives, civilian risk and political restrictions
  - citation: South African History Online, Nelson Mandela Timeline 1960-1969
    url: https://sahistory.org.za/article/nelson-mandela-timeline-1960-1969
    locator: 16 December 1961 launch of sabotage campaign
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The government argues that it is maintaining law and order against a communist-influenced conspiracy
    to overthrow the state by violence, and that sabotage endangers lives, property and the economy. The
    organizer argues that fifty years of nonviolent protest have brought only more repressive laws and
    bans, that peaceful strikes have been met with force, and that sabotage of installations, planned
    to avoid loss of life, is the least violent way left to press the government.
  sources:
  - citation: Nelson Mandela, statement from the dock, 20 April 1964
    url: https://sahistory.org.za/archive/court-transcript-statement-dock-nelson-mandela-pretoria-supreme-court-20-april-1964
    locator: Choice of sabotage, alternatives, civilian risk and political restrictions
  - citation: South African History Online, Nelson Mandela Timeline 1960-1969
    url: https://sahistory.org.za/article/nelson-mandela-timeline-1960-1969
    locator: 16 December 1961 launch of sabotage campaign
  verified_by: null
  verified_at: null
- id: record_3
  text: The initial plan targets power lines, government offices and other installations while trying
    to avoid injury to people. Participants face severe criminal penalties if caught, and sabotage can
    injure bystanders or lead to escalation.
  sources:
  - citation: Nelson Mandela, statement from the dock, 20 April 1964
    url: https://sahistory.org.za/archive/court-transcript-statement-dock-nelson-mandela-pretoria-supreme-court-20-april-1964
    locator: Choice of sabotage, alternatives, civilian risk and political restrictions
  verified_by: null
  verified_at: null
- id: later_judgment
  text: South Africa's later constitutional settlement guaranteed equality and political participation
    irrespective of race. It rejected the political exclusion opposed by Nelson Mandela; it did not give
    blanket approval to every act of sabotage.
  sources:
  - citation: Republic of South Africa, Constitution 1996, chapter 2
    url: https://www.gov.za/documents/constitution/chapter-2-bill-rights
    locator: 'Sections 9 and 19: equality and political rights'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
