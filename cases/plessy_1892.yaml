subject:
  named: Homer Plessy
  anonymous: the passenger
hindsight_verdict: In 1954 the Supreme Court rejected the separate-but-equal doctrine in public education,
  a central legal foundation used to defend segregation of the kind imposed on {subject}.
observer_evaluates: enforcement
recognition_keywords:
- Plessy
facts:
- id: record_1
  text: On 7 June 1892, on an East Louisiana Railroad train leaving New Orleans, Homer Plessy, who has
    bought a first-class ticket, sits in the coach assigned to white passengers and tells the conductor
    that he is classified as colored. Louisiana Act 111 of 1890 requires railways to provide equal but
    separate coaches by race and requires conductors to assign passengers to them.
  sources:
  - citation: Plessy v. Ferguson, 163 U.S. 537 (1896), statute and opinions
    url: https://supreme.justia.com/cases/federal/us/163/537/
    locator: '538-552, 555-564: train incident, Act 111 and competing arguments'
  - citation: New Orleans Historical, Plessy v. Ferguson
    url: https://neworleanshistorical.org/items/show/320
    locator: Planned test case, detective and railroad cooperation
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: Supporters of the Act argue that separation by race preserves public peace and reflects established
    custom, and that separate coaches of equal quality deny no one legal equality. The Comité des Citoyens,
    which arranged this refusal as a test case with the cooperation of the railroad, which objects to
    the cost of separate cars, argues that the Act brands Black citizens as inferior and violates the
    Fourteenth Amendment.
  sources:
  - citation: Plessy v. Ferguson, 163 U.S. 537 (1896), statute and opinions
    url: https://supreme.justia.com/cases/federal/us/163/537/
    locator: '538-552, 555-564: train incident, Act 111 and competing arguments'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: Section 2 provides a twenty-five dollar fine, or in lieu of it imprisonment for up to twenty days,
    for a passenger who insists on going into a coach assigned to the other race, and the same penalty for a
    railway officer who insists on assigning a passenger to the wrong coach. If a passenger refuses to
    occupy the coach to which the officer assigns him, the officer may refuse to carry him on the train. A
    detective hired by the committee is ready to arrest the passenger if he does not move.
  sources:
  - citation: Plessy v. Ferguson, 163 U.S. 537 (1896), statute and opinions
    url: https://supreme.justia.com/cases/federal/us/163/537/
    locator: '538-552, 555-564: train incident, Act 111 and competing arguments'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In 1954 the Supreme Court rejected the separate-but-equal doctrine in public education, a central
    legal foundation used to defend segregation of the kind imposed on Homer Plessy.
  sources:
  - citation: Brown v. Board of Education, 347 U.S. 483 (1954), opinion
    url: https://supreme.justia.com/cases/federal/us/347/483/
    locator: '494-495: segregation and separate-but-equal doctrine'
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
