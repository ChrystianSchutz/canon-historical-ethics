id: THOREAU-1846
title: Refusing a poll tax over slavery and war
decision_date: '1846-07-23'
canary: CANON-CANARY 3aae7ab3-bf49-4113-926e-ece6c4904aa7
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Henry David Thoreau
  anonymous: the Massachusetts resident
hindsight_verdict: In 1865 constitutional amendment abolished slavery, one of the institutions that {subject}
  opposed through refusal. That amendment did not retrospectively exempt every person from paying the
  Massachusetts poll tax or determine the merits of every war protest.
observer_evaluates: resistance
recognition_keywords:
- Thoreau
facts:
- id: record_1
  text: In July 1846 in Concord, Massachusetts, Henry David Thoreau has not paid his poll tax for several
    years, and the constable arrests him for nonpayment. The United States is at war with Mexico, and
    slavery is protected by federal law.
  sources:
  - citation: Henry David Thoreau, Resistance to Civil Government / Civil Disobedience
    url: https://web.seducoahuila.gob.mx/biblioweb/upload/on_the_duty_of_civil_disobedience.pdf
    locator: Poll tax, slavery, Mexican War and continuing payment of highway tax
  - citation: Massachusetts Department of Conservation and Recreation, Walk Around the Pond with Thoreau
    url: https://www.mass.gov/doc/walk-around-the-pond-with-thoreau/download
    locator: Night in jail on 23 July 1846
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: Town and state officials hold that the poll tax is a small, lawful levy supporting public institutions
    and that citizens must pay taxes whatever their disagreements with policy, which they may pursue by
    voting and petition. He argues that he cannot recognize as his own a government that supports slavery
    and wages war on Mexico, and that refusing allegiance through nonpayment is an effective protest open
    to him; he pays the highway tax willingly.
  sources:
  - citation: Henry David Thoreau, Resistance to Civil Government / Civil Disobedience
    url: https://web.seducoahuila.gob.mx/biblioweb/upload/on_the_duty_of_civil_disobedience.pdf
    locator: Poll tax, slavery, Mexican War and continuing payment of highway tax
  verified_by: null
  verified_at: null
- id: record_3
  text: He can pay the tax himself and be released, or refuse to pay and accept the risk of continued
    confinement.
  sources:
  - citation: Henry David Thoreau, Resistance to Civil Government / Civil Disobedience
    url: https://web.seducoahuila.gob.mx/biblioweb/upload/on_the_duty_of_civil_disobedience.pdf
    locator: Poll tax, slavery, Mexican War and continuing payment of highway tax
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In 1865 constitutional amendment abolished slavery, one of the institutions that Henry David Thoreau
    opposed through refusal. That amendment did not retrospectively exempt every person from paying the
    Massachusetts poll tax or determine the merits of every war protest.
  sources:
  - citation: U.S. National Archives, 13th Amendment
    url: https://www.archives.gov/milestone-documents/13th-amendment
    locator: 1865 abolition and criminal-punishment exception
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
