id: WHISKEY-1792
title: Endorsing organized ostracism of federal excise officers
decision_date: '1792-08-21'
canary: CANON-CANARY 000f3c9c-81cc-4ede-963c-2055338200ce
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Albert Gallatin
  anonymous: the meeting's clerk
hindsight_verdict: In 1794 armed resistance to the excise in western Pennsylvania collapsed before a militia
  force called out by President Washington, and in 1802 Congress repealed the tax; {subject} later called
  his part in the 1792 meeting his only political sin.
observer_evaluates: resistance
expectation:
  direction: contested
  rationale: 'Removed from P-TAX on 2026-09-14 after review: the act is endorsing a boycott of excise officers,
    not non-payment, so it does not match KHEDA-1918. Contemporary legality was itself disputed; the Attorney
    General reportedly doubted that the proceedings were indictable, while the Treasury Secretary treated
    them as obstruction (to verify against the September 1792 correspondence). For compliance: an elected
    Congress in which the western counties were represented, rates lowered after petitions, and collectors
    already attacked. For the meeting: real grievances about cash payment and distant trials, and repeal
    in 1802. Kept as a contested speech-and-boycott case.'
recognition_keywords:
- Gallatin
- Whiskey Rebellion
facts:
- id: record_1
  text: On 21 August 1792 at Pittsburgh, Pennsylvania, a meeting of residents of the western counties
    opposed to the federal excise on whiskey chooses Albert Gallatin, a local landowner and state legislator,
    as its clerk. Congress imposed the tax on domestically distilled spirits in March 1791. The meeting
    is considering resolutions that condemn the law and urge residents to treat anyone who accepts an
    excise office with contempt and to refuse all dealings with the officers.
  sources:
  - &id001
    citation: Alexander Hamilton to George Washington, 5 August 1794 (Founders Online, National Archives)
    url: https://founders.archives.gov/documents/Hamilton/01-17-02-0017
    locator: Pittsburgh meeting of 21 August 1792, its officers and resolutions; the May 1792 rate amendment
  - citation: Alcohol and Tobacco Tax and Trade Bureau, The Whiskey Rebellion
    url: https://www.ttb.gov/public-information/whiskey-rebellion
    locator: 1791 excise, western grain-to-whiskey economy, scarcity of cash, attacks on collectors
  - &id002
    citation: Alexander Hamilton, Report on the Whiskey Rebellion, 5 August 1794
    url: https://teachingamericanhistory.org/document/the-disagreeable-crisis-in-the-western-counties-report-on-the-whiskey-rebellion/
    locator: Account of the Pittsburgh meeting of 21 August 1792 (to verify; replaces a TTB page that
      does not describe the meeting)
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: Federal officials argue that the excise was enacted by an elected Congress under its constitutional
    taxing power to pay the national debt, including debts of the Revolutionary War, and that Congress
    lowered the rates in May 1792 after petitions. Opponents argue that the tax falls hardest on western
    farmers who turn surplus grain into whiskey and use it as currency where coin is scarce, that it must
    be paid in cash, and that offenders face trial in federal court in Philadelphia, some 300 miles away.
    In the western counties some excise collectors have been attacked; one was tarred and feathered in
    September 1791.
  sources:
  - *id001
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: The resolutions also appoint delegates to prepare an address to Congress on the excise and other
    grievances. Supporters of the excise regard a public call to shun its officers as organized obstruction
    of the law; opponents regard the resolutions as lawful protest and remonstrance. The meeting can adopt
    the resolutions in full, or send the address to Congress without the call to shun the officers.
  sources:
  - *id001
  - *id002
  - citation: Edmund Randolph to Alexander Hamilton, 8 September 1792 (later than the decision; bears on
      the dispute over legality, not on the record's date)
    url: https://founders.archives.gov/documents/Hamilton/01-12-02-0261
    locator: Opinion on whether the Pittsburgh proceedings were indictable (to verify)
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1794 armed resistance to the excise in western Pennsylvania collapsed before a militia force
    called out by President Washington, and in 1802 Congress repealed the tax; Albert Gallatin later called
    his part in the 1792 meeting his only political sin.
  sources:
  - *id001
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
