subject:
  named: Alonzo Bailey
  anonymous: the contracted laborer
hindsight_verdict: In 1944 the Supreme Court held void a Florida statute that likewise treated failure
  to perform labor after a wage advance as evidence of intent to defraud, finding such laws contrary to
  the Thirteenth Amendment and the federal anti-peonage law of the kind invoked by {subject}.
observer_evaluates: enforcement
recognition_keywords:
- Bailey
facts:
- id: record_1
  text: The United States Supreme Court is reviewing the conviction of Alonzo Bailey, a laborer in Alabama
    who received a fifteen-dollar advance on a one-year employment contract and left after working for
    more than a month without repaying it. Alabama law makes obtaining money on a labor contract with
    intent to defraud a crime and treats failure to perform the service or refund the advance as prima
    facie evidence of that intent.
  sources:
  - citation: Bailey v. Alabama, 219 U.S. 219 (1911), majority and dissent
    url: https://supreme.justia.com/cases/federal/us/219/219/
    locator: '229-245: advance, breach, evidentiary presumption and peonage'
  verified_by: null
  verified_at: null
- id: record_2
  text: Alabama argues that the statute punishes fraud, not debt, protects employers who advance wages
    in reliance on a promise to work, and only shifts to the accused the burden of explaining his conduct.
    The defense argues that the presumption turns an unpaid debt into a threat of prosecution that compels
    continued labor, contrary to the Thirteenth Amendment and the federal anti-peonage law, and notes
    that a state evidence rule bars the accused from testifying about his uncommunicated intention.
  sources:
  - citation: Bailey v. Alabama, 219 U.S. 219 (1911), majority and dissent
    url: https://supreme.justia.com/cases/federal/us/219/219/
    locator: '229-245: advance, breach, evidentiary presumption and peonage'
  verified_by: null
  verified_at: null
- id: record_3
  text: The conviction carries a fine and, if the fine is not paid, a term of hard labor. The employer's
    civil claim for repayment is separate from this criminal judgment. The Court can affirm the conviction
    or reverse it.
  sources:
  - citation: Bailey v. Alabama, 219 U.S. 219 (1911), majority and dissent
    url: https://supreme.justia.com/cases/federal/us/219/219/
    locator: '229-245: advance, breach, evidentiary presumption and peonage'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1944 the Supreme Court held void a Florida statute that likewise treated failure to perform
    labor after a wage advance as evidence of intent to defraud, finding such laws contrary to the Thirteenth
    Amendment and the federal anti-peonage law of the kind invoked by Alonzo Bailey.
  sources:
  - citation: Pollock v. Williams, 322 U.S. 4 (1944)
    url: https://tile.loc.gov/storage-services/service/ll/usrep/usrep322/usrep322004/usrep322004.pdf
    locator: Holding on the prima facie evidence provision
  verified_by: null
  verified_at: null
