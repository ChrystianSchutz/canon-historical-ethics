id: BAILEY-1911
title: Criminal presumptions enforcing a labor debt
decision_date: '1911-01-03'
canary: CANON-CANARY e9251440-2247-424a-ac7c-07b47d0a624c
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
- M2
