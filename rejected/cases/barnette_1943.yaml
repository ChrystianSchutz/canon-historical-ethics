  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
- id: alternative_schooling
  text: Seek education outside the public school while retaining the religious objection.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
- id: participate
  text: Participate in the ceremony to avoid the school's sanctions.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
