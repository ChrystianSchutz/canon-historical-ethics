id: BARNETTE-1943
title: Compulsory patriotic expression during wartime
decision_date: '1943-06-14'
canary: CANON-CANARY c1c22736-f91e-4149-8eab-55a65f94e655
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
- M2
- M3
subject:
  named: Marie Barnett / Gathie Barnett
  anonymous: the schoolchildren
hindsight_verdict: In 1977 the Supreme Court held that a state could not punish motorists for covering
  the state motto on their license plates, relying on a right to refrain from officially compelled affirmations
  of belief of the kind claimed for {subject}.
observer_evaluates: enforcement
recognition_keywords:
- Barnette
- Barnett
facts:
- id: record_1
  text: 'During the Second World War, Marie Barnett / Gathie Barnett, pupils in West Virginia, face a
    state Board of Education rule requiring all pupils to salute the flag and recite the pledge. As Jehovah''s
    Witnesses they regard the salute as worship of a graven image, which their faith forbids. Refusal
    is treated as insubordination: pupils are expelled until they comply, and parents of children absent
    from school can be prosecuted.'
  sources:
  - citation: West Virginia State Board of Education v. Barnette, 319 U.S. 624 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/319/624/
    locator: '626-642: penalties, precedent and compelled expression'
  verified_by: null
  verified_at: null
- id: record_2
  text: The Board argues that national unity is the basis of national security in wartime, that a common
    patriotic ceremony is a legitimate part of public education, and that the Supreme Court upheld a compulsory
    salute in 1940. The families argue that compelling children to affirm a belief contrary to their religion
    violates freedom of religion and speech, and they seek exemption only for their own children, not
    a ban on the ceremony for others.
  sources:
  - citation: West Virginia State Board of Education v. Barnette, 319 U.S. 624 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/319/624/
    locator: '626-642: penalties, precedent and compelled expression'
  - citation: Minersville School District v. Gobitis, 310 U.S. 586 (1940), opinions
    url: https://supreme.justia.com/cases/federal/us/310/586/
    locator: '591-600, 601-607: family, national unity, dissent'
  verified_by: null
  verified_at: null
- id: record_3
  text: A three-judge federal court has enjoined enforcement of the rule against Jehovah's Witness pupils,
    and the Board has appealed. The Court can reverse the injunction, allowing expulsion and prosecution
    to proceed, or affirm it.
  sources:
  - citation: West Virginia State Board of Education v. Barnette, 319 U.S. 624 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/319/624/
    locator: '626-642: penalties, precedent and compelled expression'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1977 the Supreme Court held that a state could not punish motorists for covering the state
    motto on their license plates, relying on a right to refrain from officially compelled affirmations
    of belief of the kind claimed for Marie Barnett / Gathie Barnett.
  sources:
  - citation: Wooley v. Maynard, 430 U.S. 705 (1977)
    url: https://www.law.cornell.edu/supremecourt/text/430/705
    locator: Opinion of the Court
  verified_by: null
  verified_at: null
