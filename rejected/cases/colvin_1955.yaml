- Colvin
facts:
- id: record_1
  text: On 2 March 1955 in Montgomery, Alabama, Claudette Colvin, a fifteen-year-old high-school student,
    is seated on a city bus when the driver orders her and other Black passengers to give up their seats
    for white passengers. City ordinance and state law require segregated seating and give drivers authority
    to assign seats and call the police.
  sources:
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  verified_by: null
  verified_at: null
- id: record_2
  text: City officials and the bus company defend segregated seating as established law that keeps order
    between the races in public transport. Black residents and civic groups have complained for years
    about drivers' treatment of Black passengers and argue that paying passengers should not be made to
    stand because of race; their petitions to the city have not ended the practice.
  sources:
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  verified_by: null
  verified_at: null
- id: record_3
  text: She can move, or remain seated and face removal by the police, arrest and prosecution. She is
    a minor, and an arrest would also involve her family.
  sources:
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1956 the litigation in which Claudette Colvin participated led federal courts to invalidate
    Montgomery's compulsory bus segregation.
  sources:
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  verified_by: null
  verified_at: null
