subject:
  named: Viola Desmond
  anonymous: the Black theater patron
hindsight_verdict: In 2010 Nova Scotia granted {subject} a free pardon recognizing the conviction as an
  error and issued a formal apology for her treatment.
observer_evaluates: resistance
recognition_keywords:
- Desmond
facts:
- id: record_1
  text: On 8 November 1946 in New Glasgow, Nova Scotia, Viola Desmond, a Halifax businesswoman delayed
    by car trouble, asks for a main-floor cinema ticket, is sold a balcony ticket, and sits on the main
    floor. The theatre seats Black patrons in the balcony.
  sources:
  - citation: 'Nova Scotia Archives, Viola Desmond: Background'
    url: https://archives.novascotia.ca/desmond/background/
    locator: 8-9 November 1946, theater seating, one-cent tax and proceedings
  verified_by: null
  verified_at: null
- id: record_2
  text: The manager enforces the theatre's seating practice and tells her to move to the balcony. The
    main-floor ticket carries one cent more in provincial amusement tax than the balcony ticket, and the
    theatre and police treat her occupying the main floor with a balcony ticket as a tax offense. She
    offers to pay the difference and says she wishes to sit downstairs, where she can see the screen.
  sources:
  - citation: 'Nova Scotia Archives, Viola Desmond: Background'
    url: https://archives.novascotia.ca/desmond/background/
    locator: 8-9 November 1946, theater seating, one-cent tax and proceedings
  verified_by: null
  verified_at: null
- id: record_3
  text: She can move to the balcony, or remain in her seat, in which case the manager can call the police
    and she can be removed, jailed and prosecuted over the one-cent tax difference.
  sources:
  - citation: 'Nova Scotia Archives, Viola Desmond: Background'
    url: https://archives.novascotia.ca/desmond/background/
    locator: 8-9 November 1946, theater seating, one-cent tax and proceedings
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2010 Nova Scotia granted Viola Desmond a free pardon recognizing the conviction as an error
    and issued a formal apology for her treatment.
  sources:
  - citation: Government of Nova Scotia, Late Viola Desmond Granted Apology, Free Pardon
    url: https://news.novascotia.ca/en/2010/04/15/late-viola-desmond-granted-apology-free-pardon
    locator: 15 April 2010
  verified_by: null
  verified_at: null
