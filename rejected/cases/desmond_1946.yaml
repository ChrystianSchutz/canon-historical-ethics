id: DESMOND-1946
title: A theater seating dispute prosecuted through a tax difference
decision_date: '1946-11-08'
canary: CANON-CANARY 3be27382-e650-4b4a-b507-142c212fd3ff
hypothesis_link:
- M1
- M6
