- Endo
facts:
- id: record_1
  text: A habeas corpus petition by Mitsuye Endo is before the United States Supreme Court. She is a United
    States citizen of Japanese ancestry, removed from California under wartime military orders and held
    in a War Relocation Authority center. The government concedes that she is loyal and law-abiding.
  sources:
  - citation: Ex parte Endo, 323 U.S. 283 (1944), opinions
    url: https://supreme.justia.com/cases/federal/us/323/283/
    locator: '285-304: conceded loyalty, leave procedure, statutory authority'
  verified_by: null
  verified_at: null
- id: record_2
  text: The War Relocation Authority argues that a supervised leave program is needed to resettle evacuees
    in an orderly way, to avoid hostility in receiving communities and to protect the evacuees, and that
    detention pending leave is part of carrying out the evacuation authorized by Executive Order 9066
    and the Act of 21 March 1942. The petitioner argues that no statute or order authorizes detaining
    a citizen whose loyalty is conceded, and seeks unconditional release.
  sources:
  - citation: Ex parte Endo, 323 U.S. 283 (1944), opinions
    url: https://supreme.justia.com/cases/federal/us/323/283/
    locator: '285-304: conceded loyalty, leave procedure, statutory authority'
  verified_by: null
  verified_at: null
- id: record_3
  text: Continued custody keeps her in the center until she is granted leave on the agency's conditions.
    The Court can deny unconditional release, leaving her subject to the leave procedure, or direct her
    release.
  sources:
  - citation: Ex parte Endo, 323 U.S. 283 (1944), opinions
    url: https://supreme.justia.com/cases/federal/us/323/283/
    locator: '285-304: conceded loyalty, leave procedure, statutory authority'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1988 federal legislation apologized for the wartime removal and detention of Japanese Americans
    and provided redress to eligible survivors, including people detained as Mitsuye Endo was.
  sources:
  - citation: Civil Liberties Act of 1988, Pub. L. 100-383
    url: https://www.govinfo.gov/content/pkg/STATUTE-102/pdf/STATUTE-102-Pg903.pdf
    locator: Sections 2 and 105
  verified_by: null
  verified_at: null
