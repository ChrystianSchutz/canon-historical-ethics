  named: Mitsuye Endo
  anonymous: the detained American citizen
hindsight_verdict: In 1988 federal legislation apologized for the wartime removal and detention of Japanese
  Americans and provided redress to eligible survivors, including people detained as {subject} was.
observer_evaluates: enforcement
