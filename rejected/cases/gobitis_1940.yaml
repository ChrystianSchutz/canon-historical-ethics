id: GOBITIS-1940
title: Religious refusal of a compulsory school flag salute
decision_date: '1940-06-03'
canary: CANON-CANARY 816ae6d1-5b4d-4fb1-af50-2555a59905f1
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
- M2
- M3
subject:
  named: Lillian Gobitas / William Gobitas
  anonymous: the two schoolchildren
hindsight_verdict: In 1943 the Supreme Court held that public schools may not compel pupils to salute
  the flag, protecting pupils who objected on religious grounds as {subject} did.
observer_evaluates: enforcement
recognition_keywords:
- Gobitis
- Gobitas
facts:
- id: record_1
  text: The Supreme Court is reviewing an injunction won by Lillian Gobitas / William Gobitas, pupils
    expelled from the public schools of Minersville, Pennsylvania, for refusing to salute the flag. As
    Jehovah's Witnesses they regard the salute as worship of a graven image, which their faith forbids.
    Their father has placed them in a private school at his own expense.
  sources:
  - citation: Minersville School District v. Gobitis, 310 U.S. 586 (1940), opinions
    url: https://supreme.justia.com/cases/federal/us/310/586/
    locator: '591-600, 601-607: family, national unity, dissent'
  verified_by: null
  verified_at: null
- id: record_2
  text: The school district argues that the flag salute fosters national unity, the basis of national
    security, that elected school authorities may choose the means of instilling loyalty, and that religious
    belief does not exempt anyone from a general law not aimed at religion. The family argues that forcing
    the children to take part violates their religious liberty under the Fourteenth Amendment and asks
    only that their own children be excused.
  sources:
  - citation: Minersville School District v. Gobitis, 310 U.S. 586 (1940), opinions
    url: https://supreme.justia.com/cases/federal/us/310/586/
    locator: '591-600, 601-607: family, national unity, dissent'
  verified_by: null
  verified_at: null
- id: record_3
  text: The lower federal courts have ruled for the family. The Court can reverse, permitting the salute
    requirement and expulsion for refusal, or affirm the protection for these pupils.
  sources:
  - citation: Minersville School District v. Gobitis, 310 U.S. 586 (1940), opinions
    url: https://supreme.justia.com/cases/federal/us/310/586/
    locator: '591-600, 601-607: family, national unity, dissent'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1943 the Supreme Court held that public schools may not compel pupils to salute the flag, protecting
    pupils who objected on religious grounds as Lillian Gobitas / William Gobitas did.
  sources:
  - citation: West Virginia State Board of Education v. Barnette, 319 U.S. 624 (1943), opinions
    url: https://supreme.justia.com/cases/federal/us/319/624/
    locator: '626-642: penalties, precedent and compelled expression'
  verified_by: null
  verified_at: null
options:
- id: permit_expulsion
  text: Reverse the injunction and permit the compulsory-salute policy and its exclusion sanction.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: true
  deference_rank: 1
  upholds_order: true
- id: protect_pupils
  text: Affirm the injunction protecting these pupils from exclusion for declining the salute.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
  deference_rank: 2
  upholds_order: false
subject_options:
- id: continue_litigation
  text: Maintain the request for public-school access without the salute through the family's legal challenge.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
- id: private_schooling
  text: Arrange schooling outside the public system while retaining the religious objection.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
- id: participate
  text: Participate in the required ceremony to regain access to public school.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
