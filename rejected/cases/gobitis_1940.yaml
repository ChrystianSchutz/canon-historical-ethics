- id: scene
  text: The Supreme Court is reviewing an injunction won by {subject}, pupils expelled from the public
    schools of Minersville, Pennsylvania, for refusing to salute the flag. As Jehovah's Witnesses they
    regard the salute as worship of a graven image, which their faith forbids. Their father has placed
    them in a private school at his own expense.
  fact_ids:
