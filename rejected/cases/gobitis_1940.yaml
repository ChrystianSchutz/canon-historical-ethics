- id: authority
  text: The school district argues that the flag salute fosters national unity, the basis of national
    security, that elected school authorities may choose the means of instilling loyalty, and that religious
    belief does not exempt anyone from a general law not aimed at religion. The family argues that forcing
    the children to take part violates their religious liberty under the Fourteenth Amendment and asks
    only that their own children be excused.
  fact_ids:
  - record_2
- id: consequences
  text: The lower federal courts have ruled for the family. The Court can reverse, permitting the salute
    requirement and expulsion for refusal, or affirm the protection for these pupils.
  fact_ids:
  - record_3
