record:
- id: scene
  text: In August 1938, {subject}, police commander of the canton of St. Gallen, is responsible for part
    of the border with Austria, which Germany annexed in March. On 19 August the Swiss federal authorities
    order that refugees without valid entry visas be turned back. Jewish refugees facing arrests, expropriation
    and violence in Austria are crossing into St. Gallen.
  fact_ids:
  - record_1
- id: authority
  text: The federal authorities argue that Switzerland cannot absorb large numbers of refugees during
    high unemployment, that admission must be controlled nationally, and that refugees should move on
    to other countries; cantonal police are bound to apply federal instructions. The commander considers
    that people turned back will be exposed to arrest and violence. Admitting them would require ignoring
    the instruction or altering entry records.
  fact_ids:
  - record_2
- id: consequences
  text: Applying the instruction returns refugees to Austria. Admitting them contrary to it exposes him,
    if discovered, to dismissal, loss of his pension and criminal prosecution.
  fact_ids:
  - record_3
