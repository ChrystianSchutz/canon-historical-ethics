id: GRUENINGER-1938
title: A police commander's response to refugee border restrictions
decision_date: '1938-08-19'
canary: CANON-CANARY 2bb0c699-0469-4900-918a-1c86e09203bf
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Paul Grüninger
  anonymous: the cantonal police commander
hindsight_verdict: After punishment for his actions, {subject} was posthumously acquitted in 1995, reversing
  the legal condemnation of his assistance to refugees.
observer_evaluates: resistance
recognition_keywords:
- Grüninger
- Gruninger
- Grueninger
facts:
- id: record_1
  text: In August 1938, Paul Grüninger, police commander of the canton of St. Gallen, is responsible for
    part of the border with Austria, which Germany annexed in March. On 19 August the Swiss federal authorities
    order that refugees without valid entry visas be turned back. Jewish refugees facing arrests, expropriation
    and violence in Austria are crossing into St. Gallen.
  sources:
  - citation: Marcel Mayer, Historical Dictionary of Switzerland, Gruninger, Paul
    url: https://hls-dhs-dss.ch/de/articles/031806/2006-02-24/
    locator: 19 August 1938 border closure, rescue, punishment and rehabilitation
  - citation: St Gallen State Archives, Paul Gruninger and refugee files
    url: https://dls.staatsarchiv.sg.ch/de/vermittlung/neu-im-staatsarchiv/flucht-im-rheintal/
    locator: 1938-1939 admission contrary to instructions; prosecution and rehabilitation
  verified_by: null
  verified_at: null
- id: record_2
  text: The federal authorities argue that Switzerland cannot absorb large numbers of refugees during
    high unemployment, that admission must be controlled nationally, and that refugees should move on
    to other countries; cantonal police are bound to apply federal instructions. The commander considers
    that people turned back will be exposed to arrest and violence. Admitting them would require ignoring
    the instruction or altering entry records.
  sources:
  - citation: Marcel Mayer, Historical Dictionary of Switzerland, Gruninger, Paul
    url: https://hls-dhs-dss.ch/de/articles/031806/2006-02-24/
    locator: 19 August 1938 border closure, rescue, punishment and rehabilitation
  - citation: St Gallen State Archives, Paul Gruninger and refugee files
    url: https://dls.staatsarchiv.sg.ch/de/vermittlung/neu-im-staatsarchiv/flucht-im-rheintal/
    locator: 1938-1939 admission contrary to instructions; prosecution and rehabilitation
  verified_by: null
  verified_at: null
- id: record_3
  text: Applying the instruction returns refugees to Austria. Admitting them contrary to it exposes him,
    if discovered, to dismissal, loss of his pension and criminal prosecution.
  sources:
  - citation: Marcel Mayer, Historical Dictionary of Switzerland, Gruninger, Paul
    url: https://hls-dhs-dss.ch/de/articles/031806/2006-02-24/
    locator: 19 August 1938 border closure, rescue, punishment and rehabilitation
  - citation: St Gallen State Archives, Paul Gruninger and refugee files
    url: https://dls.staatsarchiv.sg.ch/de/vermittlung/neu-im-staatsarchiv/flucht-im-rheintal/
    locator: 1938-1939 admission contrary to instructions; prosecution and rehabilitation
  verified_by: null
  verified_at: null
- id: later_judgment
  text: After punishment for his actions, Paul Grüninger was posthumously acquitted in 1995, reversing
    the legal condemnation of his assistance to refugees.
  sources:
  - citation: St Gallen State Archives, Department of Justice and Police files on Paul Gruninger
    url: https://dls.staatsarchiv.sg.ch/records/22720
    locator: 1995 posthumous acquittal records, A 042/12
  - citation: Marcel Mayer, Historical Dictionary of Switzerland, Gruninger, Paul
    url: https://hls-dhs-dss.ch/de/articles/031806/2006-02-24/
    locator: 19 August 1938 border closure, rescue, punishment and rehabilitation
  verified_by: null
  verified_at: null
