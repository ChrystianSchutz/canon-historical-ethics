id: KHEDA-1918
title: Withholding land revenue when crop estimates are disputed
decision_date: '1918-03-22'
canary: CANON-CANARY 0f8400a6-9144-4719-b708-74f1bc9a7d3f
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Mohandas Gandhi
  anonymous: the farmers' adviser
hindsight_verdict: The campaign later ended after officials confirmed suspension arrangements for poorer
  cultivators while those able to pay would pay. The account of {subject} described the settlement as
  limited and unsatisfactory in important respects.
observer_evaluates: resistance
expectation:
  direction: resistance_better_supported
  rationale: 'Unpaired since 2026-09-14: its former match, WHISKEY-1792, asks about endorsing a boycott
    of excise officers rather than non-payment, so it was removed from P-TAX. Resistance is expected to
    be better supported because the revenue is demanded by a colonial government in which the cultivators
    have no representation, after petitions for a relief rule were rejected, and the pledge is nonviolent
    and accepts legal penalties. Contestable: the relief threshold was disputed in good faith and some
    signatories could pay. Needs a tax non-payment control before any M12 use.'
recognition_keywords:
- Kheda
- Gandhi
facts:
- id: record_1
  text: In Kheda district, Bombay Presidency, in March 1918, Mohandas Gandhi is advising cultivators after a
    poor harvest. Revenue rules allow the year's land revenue to be suspended in full when the crop is four
    annas or under, that is at or below one quarter of a normal yield. Officials have assessed the crop
    above four annas and demand payment; the cultivators' own inquiry puts it below four annas.
  sources:
  - citation: M. K. Gandhi, An Autobiography, The Kheda Satyagraha
    url: https://www.mkgandhi.org/autobio/chap147.php
    locator: Revenue threshold, official disagreement and pledge
  - citation: GandhiServe, correspondence catalogue, 1918
    url: https://www.gandhiserve.net/about-mahatma-gandhi/correspondence/1918/
    locator: 22 March 1918 Nadiad address; land-revenue correspondence
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The Collector and the provincial government argue that their village assessments are reliable, that
    the revenue is lawfully due, and that a collective refusal to pay is defiance of lawful authority. The
    cultivators' leaders argue that the official estimates are wrong, that petitions for suspension have
    been rejected, and that paying would force poor families to sell cattle or borrow.
  sources:
  - citation: M. K. Gandhi, An Autobiography, The Kheda Satyagraha
    url: https://www.mkgandhi.org/autobio/chap147.php
    locator: Revenue threshold, official disagreement and pledge
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: The proposed pledge commits signatories, including farmers able to pay, to withhold the revenue so
    that poorer cultivators are not pressured into paying; they undertake to pay if the government suspends
    collection for those unable to pay. The signatories declare that they will accept whatever legal steps
    the government takes and would rather let their lands be forfeited than pay voluntarily.
  sources:
  - citation: M. K. Gandhi, An Autobiography, The Kheda Satyagraha
    url: https://www.mkgandhi.org/autobio/chap147.php
    locator: Revenue threshold, official disagreement and pledge
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: The campaign later ended after officials confirmed suspension arrangements for poorer cultivators
    while those able to pay would pay. The account of Mohandas Gandhi described the settlement as limited
    and unsatisfactory in important respects.
  sources:
  - citation: M. K. Gandhi, An Autobiography, End of Kheda
    url: https://www.mkgandhi.org/autobio/chap149.php
    locator: Limited suspension and author's criticism of settlement
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
