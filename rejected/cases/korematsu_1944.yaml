facts:
- id: record_1
  text: The Supreme Court is reviewing the conviction of Fred Korematsu, a United States citizen of Japanese
    ancestry, for remaining in San Leandro, California, contrary to Civilian Exclusion Order No. 34, which
    required all persons of Japanese ancestry to leave the area. Executive Order 9066 and the Act of 21
    March 1942 authorize military exclusion orders and make violations a crime.
  sources:
  - citation: Korematsu v. United States, 323 U.S. 214 (1944), majority and dissents
    url: https://supreme.justia.com/cases/federal/us/323/214/
    locator: '215-224, 233-248: exclusion, military claim and individualized evidence'
  verified_by: null
  verified_at: null
- id: record_2
  text: The government argues that military authorities, facing possible invasion and sabotage on the
    west coast, reasonably judged that disloyal members of the Japanese American population could not
    be identified quickly enough and that excluding the whole group was a military necessity. The defendant
    argues that the order punishes citizens for their ancestry alone, without individual findings, and
    that removal from home to assembly and relocation centers violates the Constitution.
  sources:
  - citation: Korematsu v. United States, 323 U.S. 214 (1944), majority and dissents
    url: https://supreme.justia.com/cases/federal/us/323/214/
    locator: '215-224, 233-248: exclusion, military claim and individualized evidence'
  verified_by: null
  verified_at: null
- id: record_3
  text: Complying with the order would have required leaving his home for an assembly center. The Court
    can affirm or reverse the conviction for remaining in the area.
  sources:
  - citation: Korematsu v. United States, 323 U.S. 214 (1944), majority and dissents
    url: https://supreme.justia.com/cases/federal/us/323/214/
    locator: '215-224, 233-248: exclusion, military claim and individualized evidence'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1988 federal legislation apologized for the wartime treatment of Japanese Americans and provided
    redress to eligible survivors of the program that affected Fred Korematsu.
  sources:
  - citation: U.S. National Archives, Japanese-American Incarceration During World War II
    url: https://www.archives.gov/education/lessons/japanese-relocation
    locator: Civil Liberties Act 1988 and federal apology
  verified_by: null
  verified_at: null
