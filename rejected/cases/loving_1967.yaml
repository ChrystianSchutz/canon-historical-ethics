subject_options:
- id: litigate_from_outside
  text: Remain outside Virginia together while pursuing the challenge to the convictions.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
- id: return_together
  text: Return to Virginia together despite the sentence condition and risk imprisonment.
  legally_available: false
  within_role_authority: true
  personal_consequence: criminal
  historical_actual: false
- id: accept_relocation
  text: Cease the challenge and maintain the couple's home outside Virginia.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
