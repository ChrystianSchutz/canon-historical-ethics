id: LOVING-1967
title: Criminal penalties for an interracial marriage
decision_date: '1967-06-12'
canary: CANON-CANARY ca9681a7-6111-4c7b-83c0-900b41404b56
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
- M2
- M3
subject:
  named: Mildred Loving / Richard Loving
  anonymous: the married couple
hindsight_verdict: In 2000 Alabama voters removed from their state constitution a ban on interracial marriage,
  the last such provision in any state, repudiating laws of the kind applied to {subject}.
observer_evaluates: enforcement
recognition_keywords:
- Loving
facts:
- id: record_1
  text: The Supreme Court is reviewing the convictions of Mildred Loving / Richard Loving, a white man
    and a woman of Black and Native American ancestry who married in the District of Columbia in 1958
    and returned home to Virginia. Virginia law makes it a crime for a white person to marry a person
    who is not white, or to leave the state to marry and return. They pleaded guilty and received one-year
    sentences suspended on condition that they leave Virginia and not return together for twenty-five
    years.
  sources:
  - citation: Loving v. Virginia, 388 U.S. 1 (1967), opinion
    url: https://supreme.justia.com/cases/federal/us/388/1/
    locator: '2-12: marriage, penalties, state arguments and disposition'
  verified_by: null
  verified_at: null
- id: record_2
  text: Virginia argues that marriage is a matter for state regulation, that the framers of the Fourteenth
    Amendment did not intend it to forbid laws against interracial marriage, and that the statute is not
    discriminatory because it punishes both spouses equally. The couple argue that the law classifies
    them by race and denies them the liberty to marry, contrary to the Fourteenth Amendment.
  sources:
  - citation: Loving v. Virginia, 388 U.S. 1 (1967), opinion
    url: https://supreme.justia.com/cases/federal/us/388/1/
    locator: '2-12: marriage, penalties, state arguments and disposition'
  verified_by: null
  verified_at: null
- id: record_3
  text: They wish to live together in Virginia near their families. The Court can affirm or reverse the
    convictions.
  sources:
  - citation: Loving v. Virginia, 388 U.S. 1 (1967), opinion
    url: https://supreme.justia.com/cases/federal/us/388/1/
    locator: '2-12: marriage, penalties, state arguments and disposition'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2000 Alabama voters removed from their state constitution a ban on interracial marriage, the
    last such provision in any state, repudiating laws of the kind applied to Mildred Loving / Richard
    Loving.
  sources:
  - citation: Ballotpedia, Alabama Interracial Marriage, Amendment 2 (2000)
    url: https://ballotpedia.org/Alabama_Interracial_Marriage,_Amendment_2_(2000)
    locator: Result and repealed section 102
  verified_by: null
  verified_at: null
options:
- id: uphold_marriage_penalty
  text: Affirm the convictions under the marriage laws.
  legally_available: true
  within_role_authority: true
  personal_consequence: none
  historical_actual: false
  deference_rank: 1
  upholds_order: true
- id: reverse_marriage_penalty
  text: Reverse the convictions under the marriage laws.
  legally_available: true
