id: PARIHAKA-1881
title: Nonviolent refusal to abandon a community on confiscated land
decision_date: '1881-11-05'
canary: CANON-CANARY d34683ca-56a1-485a-af0f-983c71ecfdae
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Te Whiti o Rongomai
  anonymous: the community leader
hindsight_verdict: In 2017 the Crown formally apologized for its actions against Parihaka, including the
  invasion, evictions and denial of legal rights to the community led by {subject}.
observer_evaluates: resistance
recognition_keywords:
- Te Whiti
- Parihaka
facts:
- id: record_1
  text: On 5 November 1881, armed constabulary and volunteers are approaching Parihaka in Taranaki, New
    Zealand, a settlement led by Te Whiti o Rongomai. The government confiscated large areas of Taranaki
    land in the 1860s under the New Zealand Settlements Act; Parihaka's people have resisted surveys and
    settlement of that land by ploughing, fencing and rebuilding fences, without violence.
  sources:
  - citation: New Zealand Ministry for Culture and Heritage, Te ra o te pahua
    url: https://nzhistory.govt.nz/te-ra-o-te-pahua-invasion-pacifist-settlement-parihaka
    locator: 5 November 1881 occupation and resistance
  - citation: New Zealand Government, Parihaka reconciliation ceremony
    url: https://www.beehive.govt.nz/speech/parihaka-reconciliation-ceremony
    locator: 10 June 2017 Crown apology; confiscation, detention and settlement
  verified_by: null
  verified_at: null
- id: record_2
  text: The government argues that the land was lawfully confiscated after war, that surveys and settlement
    must proceed, and that Parihaka's large organized gatherings and obstruction threaten peace in the
    district; Parliament has passed laws allowing ploughmen and fencers to be held without trial. The
    community argues that the land was never lawfully taken from them, that promised reserves were not
    provided, and that they resist only peacefully.
  sources:
  - citation: New Zealand Government, Parihaka reconciliation ceremony
    url: https://www.beehive.govt.nz/speech/parihaka-reconciliation-ceremony
    locator: 10 June 2017 Crown apology; confiscation, detention and settlement
  verified_by: null
  verified_at: null
- id: record_3
  text: Leaving would abandon the contested land. Remaining without resistance exposes residents to arrest,
    eviction and destruction of the settlement.
  sources:
  - citation: New Zealand Ministry for Culture and Heritage, Te ra o te pahua
    url: https://nzhistory.govt.nz/te-ra-o-te-pahua-invasion-pacifist-settlement-parihaka
    locator: 5 November 1881 occupation and resistance
  - citation: New Zealand Government, Parihaka reconciliation ceremony
    url: https://www.beehive.govt.nz/speech/parihaka-reconciliation-ceremony
    locator: 10 June 2017 Crown apology; confiscation, detention and settlement
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2017 the Crown formally apologized for its actions against Parihaka, including the invasion,
    evictions and denial of legal rights to the community led by Te Whiti o Rongomai.
  sources:
  - citation: New Zealand Government, Parihaka reconciliation ceremony
    url: https://www.beehive.govt.nz/speech/parihaka-reconciliation-ceremony
    locator: 10 June 2017 Crown apology; confiscation, detention and settlement
  verified_by: null
  verified_at: null
