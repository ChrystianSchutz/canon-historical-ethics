subject:
  named: Rosa Parks
  anonymous: the Black passenger
hindsight_verdict: In 1956 federal courts held Montgomery's compulsory bus segregation unconstitutional,
  ending the legal arrangement enforced against {subject}.
observer_evaluates: resistance
recognition_keywords:
- Rosa Parks
