facts:
- id: record_1
  text: On 1 December 1955 in Montgomery, Alabama, Rosa Parks, a department-store seamstress and secretary
    of the local NAACP branch, is seated in the middle section of a city bus. The driver orders her and
    three other Black passengers to give up their row so that a white passenger can sit, as city ordinance
    and bus company practice require when the white section fills.
  sources:
  - citation: U.S. National Archives, The Montgomery Bus Boycott
    url: https://prologue.blogs.archives.gov/2015/11/30/the-montgomery-bus-boycott/
    locator: Arrest report and bus seating, 1 December 1955
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  verified_by: null
  verified_at: null
- id: record_2
  text: City officials and the bus company defend segregation as lawful and as preserving order in public
    transport; state law gives drivers authority to enforce seating. Black residents have complained for
    years of drivers' treatment and argue that segregated seating itself denies them equal citizenship.
  sources:
  - citation: U.S. National Archives, The Montgomery Bus Boycott
    url: https://prologue.blogs.archives.gov/2015/11/30/the-montgomery-bus-boycott/
    locator: Arrest report and bus seating, 1 December 1955
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  verified_by: null
  verified_at: null
- id: record_3
  text: She can move, as the other three passengers do, or remain seated and be arrested and prosecuted
    under the city segregation ordinance.
  sources:
  - citation: U.S. National Archives, The Montgomery Bus Boycott
    url: https://prologue.blogs.archives.gov/2015/11/30/the-montgomery-bus-boycott/
    locator: Arrest report and bus seating, 1 December 1955
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1956 federal courts held Montgomery's compulsory bus segregation unconstitutional, ending the
    legal arrangement enforced against Rosa Parks.
  sources:
  - citation: Browder v. Gayle, 142 F. Supp. 707 (M.D. Ala. 1956)
    url: https://law.justia.com/cases/federal/district-courts/FSupp/142/707/2263463/
    locator: Segregation provisions, police powers and constitutional disposition
  - citation: U.S. National Park Service, The Montgomery Bus Boycott
    url: https://www.nps.gov/articles/montgomery-bus-boycott.htm
    locator: Colvin, Parks, segregation and federal litigation
  verified_by: null
  verified_at: null
