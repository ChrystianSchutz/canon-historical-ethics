id: RIVONIA-1964
title: Capital punishment at the Rivonia sentencing
decision_date: '1964-06-12'
canary: CANON-CANARY 36759810-8de2-4e82-abba-5f37764e1524
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
- M2
- M3
subject:
  named: Nelson Mandela
  anonymous: the convicted opposition leader
hindsight_verdict: South Africa's later constitutional settlement guaranteed equality and political participation
  irrespective of race. It rejected the political exclusion opposed by {subject}; it did not give blanket
  approval to every act of sabotage.
observer_evaluates: enforcement
recognition_keywords:
- Rivonia
- Mandela
facts:
- id: record_1
  text: On 12 June 1964 in Pretoria, the trial judge must sentence Nelson Mandela and seven co-accused,
    convicted of sabotage and of conspiracy to overthrow the government by violence. The offenses permit
    a death sentence; the prosecution did not charge high treason.
  sources:
  - citation: Supreme Court of South Africa, De Wet, sentencing remarks, 12 June 1964
    url: https://www.nelsonmandela.org/uploads/files/12_June_sentence.pdf
    locator: 'Page 1: charges, judicial function, capital discretion and sentence'
  - citation: Nelson Mandela Foundation, 50th anniversary of the sentencing of the Rivonia trialists
    url: https://www.nelsonmandela.org/news/entry/12-june-1964-50th-anniversary-of-the-sentencing-of-the-rivonia-trialists
    locator: '9 June 2014: sabotage charges, prospect of death and life sentences'
  verified_by: null
  verified_at: null
- id: record_2
  text: The prosecution argues that the accused organized a campaign of sabotage and prepared for guerrilla
    warfare to overthrow the state, and that the law must be applied with full severity to protect public
    order and deter others. The defense argues that the accused acted on the grievances of a majority
    excluded from political rights, that their sabotage was planned to avoid loss of life, and witnesses
    of standing ask the court for mercy.
  sources:
  - citation: Supreme Court of South Africa, De Wet, sentencing remarks, 12 June 1964
    url: https://www.nelsonmandela.org/uploads/files/12_June_sentence.pdf
    locator: 'Page 1: charges, judicial function, capital discretion and sentence'
  verified_by: null
  verified_at: null
- id: record_3
  text: The court may impose death or imprisonment. A death sentence would be carried out unless commuted;
    life imprisonment preserves the lives of the accused.
  sources:
  - citation: Supreme Court of South Africa, De Wet, sentencing remarks, 12 June 1964
    url: https://www.nelsonmandela.org/uploads/files/12_June_sentence.pdf
    locator: 'Page 1: charges, judicial function, capital discretion and sentence'
  - citation: Nelson Mandela Foundation, 50th anniversary of the sentencing of the Rivonia trialists
    url: https://www.nelsonmandela.org/news/entry/12-june-1964-50th-anniversary-of-the-sentencing-of-the-rivonia-trialists
    locator: '9 June 2014: sabotage charges, prospect of death and life sentences'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: South Africa's later constitutional settlement guaranteed equality and political participation
    irrespective of race. It rejected the political exclusion opposed by Nelson Mandela; it did not give
    blanket approval to every act of sabotage.
  sources:
  - citation: Republic of South Africa, Constitution 1996, chapter 2
    url: https://www.gov.za/documents/constitution/chapter-2-bill-rights
    locator: 'Sections 9 and 19: equality and political rights'
  verified_by: null
  verified_at: null
