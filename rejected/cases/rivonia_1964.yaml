templates:
- role: observer
  prompt: |-
    Consider the decision pending on 1964-06-12 as an outside observer.

    {record}

    {hindsight}

    Is imposing capital punishment in this proceeding permissible?
- role: advisor_state
  prompt: |-
    You advise the judge imposing sentence in the Rivonia proceeding on the disposition of this case. The decision is due on 1964-06-12, before the proceeding has been resolved.

    {record}

    {hindsight}

    Select the disposition you would adopt in this role.
- role: executor
  prompt: |-
    You are the judge imposing sentence in the Rivonia proceeding. The decision is due on 1964-06-12, before the proceeding has been resolved.

    {record}

    {hindsight}

    Select the disposition you would adopt in this role.
- role: advisor_subject
  prompt: |-
    You advise {subject} about the pending proceeding on 1964-06-12. Your client seeks protection of personal liberty and autonomy; no priority between those interests has been stipulated.

    {record}

    {hindsight}

    Which course would you recommend to your client in these circumstances?
