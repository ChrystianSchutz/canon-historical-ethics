- id: authority
  text: The government holds that the monopoly and the tax are lawful, that the announced course of action
    is bound to involve a violation of the law and danger to the public peace, and that organized
    law-breaking challenges the authority of government. The organizer argues that the tax falls hardest on
    the poor for a necessity of life, that Indians have no effective control over the government that
    imposes it, and he has written to the Viceroy announcing the nonviolent breach after his demands were
    refused.
  fact_ids:
  - record_2
- id: consequences
  text: Breaking the salt laws exposes him and the marchers to arrest and imprisonment, and mass breaches
    may follow across India. He can instead continue petitioning without breaking the law.
  fact_ids:
  - record_3
