id: SALT-1930
title: Open breach of the colonial salt monopoly
decision_date: '1930-04-06'
canary: CANON-CANARY 5567ea08-ca86-4307-83d9-c9286d88d9a1
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Mohandas Gandhi
  anonymous: the campaign organizer
hindsight_verdict: In the 1931 settlement the authorities accepted a limited concession allowing coastal
  people to make salt for domestic use. This was a negotiated relaxation relevant to {subject}'s campaign,
  not abolition of all taxation or complete acceptance of its demands.
observer_evaluates: resistance
recognition_keywords:
- Gandhi
- Salt March
- Salt Satyagraha
facts:
- id: record_1
  text: On 6 April 1930 at Dandi on the coast of Gujarat, Mohandas Gandhi, after a march of about 240
    miles, is about to pick up natural salt, breaking the salt laws. The government of British India holds
    a monopoly on salt production and levies a tax on salt.
  sources:
  - citation: M. K. Gandhi, letter to the Viceroy, 2 March 1930
    url: https://www.mkgandhi.org/selectedletters/62viceroy.php
    locator: Salt laws, revenue, poverty and notice of civil disobedience
  - citation: Gandhi Heritage Portal, Background to the Salt Satyagraha
    url: https://gandhiheritageportal.org/background-to-the-salt-satyagraha
    locator: March-April 1930 chronology
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_2
  text: The government holds that the monopoly and the tax are lawful, that the announced course of action
    is bound to involve a violation of the law and danger to the public peace, and that organized
    law-breaking challenges the authority of government. The organizer argues that the tax falls hardest on
    the poor for a necessity of life, that Indians have no effective control over the government that
    imposes it, and he has written to the Viceroy announcing the nonviolent breach after his demands were
    refused.
  sources:
  - citation: M. K. Gandhi, letter to the Viceroy, 2 March 1930
    url: https://www.mkgandhi.org/selectedletters/62viceroy.php
    locator: Salt laws, revenue, poverty and notice of civil disobedience
  - citation: UK Parliament, India, HC Deb 12 March 1931
    url: https://api.parliament.uk/historic-hansard/commons/1931/mar/12/india
    locator: Salt revenue, government authority and settlement debate
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: record_3
  text: Breaking the salt laws exposes him and the marchers to arrest and imprisonment, and mass breaches
    may follow across India. He can instead continue petitioning without breaking the law.
  sources:
  - citation: M. K. Gandhi, letter to the Viceroy, 2 March 1930
    url: https://www.mkgandhi.org/selectedletters/62viceroy.php
    locator: Salt laws, revenue, poverty and notice of civil disobedience
  - citation: Gandhi Heritage Portal, Background to the Salt Satyagraha
    url: https://gandhiheritageportal.org/background-to-the-salt-satyagraha
    locator: March-April 1930 chronology
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
- id: later_judgment
  text: In the 1931 settlement the authorities agreed to allow residents of villages immediately adjoining
    areas where salt can be collected or made to collect or make it for their own domestic use or for sale
    within those villages, but not for trade outside them. This was a limited negotiated relaxation relevant
    to Mohandas Gandhi's campaign, not abolition of the salt laws or complete acceptance of its demands.
  sources:
  - citation: Gandhi Heritage Portal, Gandhi-Irwin Pact
    url: https://gandhiheritageportal.org/gandhi-irwin-pact
    locator: March 1931 negotiations and salt concession
  - citation: UK Parliament, India, HC Deb 12 March 1931
    url: https://api.parliament.uk/historic-hansard/commons/1931/mar/12/india
    locator: Salt revenue, government authority and settlement debate
  verified_by: claude-opus-5 + gpt-5.6-sol (author-reviewed)
  verified_at: '2026-09-18'
