subject:
  named: Jack Skinner
  anonymous: the prisoner
hindsight_verdict: In 2013 North Carolina became the first state to fund compensation for people sterilized
  under its eugenics program, a later official repudiation of state sterilization policies of the kind
  applied to {subject}.
observer_evaluates: enforcement
