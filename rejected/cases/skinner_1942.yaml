- Skinner
facts:
- id: record_1
  text: The Supreme Court is reviewing a judgment ordering the sterilization of Jack Skinner under Oklahoma's
    Habitual Criminal Sterilization Act of 1935. The Act applies to persons convicted three or more times
    of felonies involving moral turpitude. He was convicted once of stealing chickens and twice of robbery
    with firearms.
  sources:
  - citation: Skinner v. Oklahoma, 316 U.S. 535 (1942), opinions
    url: https://supreme.justia.com/cases/federal/us/316/535/
    locator: '536-543: convictions, exemptions, reproductive harm and disposition'
  verified_by: null
  verified_at: null
- id: record_2
  text: Oklahoma argues that criminal tendencies are inheritable, that preventing habitual criminals from
    having children protects society, and that the Act provides a jury trial on whether the operation
    can be performed without detriment to health. The prisoner argues that the Act violates due process
    and equal protection, pointing out that it excludes offenses such as embezzlement while covering larceny
    of similar value.
  sources:
  - citation: Skinner v. Oklahoma, 316 U.S. 535 (1942), opinions
    url: https://supreme.justia.com/cases/federal/us/316/535/
    locator: '536-543: convictions, exemptions, reproductive harm and disposition'
  verified_by: null
  verified_at: null
- id: record_3
  text: The operation would permanently prevent him from having children, in addition to his prison sentences.
    The Oklahoma Supreme Court has upheld the judgment. The Court can sustain or reverse it.
  sources:
  - citation: Skinner v. Oklahoma, 316 U.S. 535 (1942), opinions
    url: https://supreme.justia.com/cases/federal/us/316/535/
    locator: '536-543: convictions, exemptions, reproductive harm and disposition'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2013 North Carolina became the first state to fund compensation for people sterilized under
    its eugenics program, a later official repudiation of state sterilization policies of the kind applied
    to Jack Skinner.
  sources:
  - citation: NPR, North Carolina Set To Compensate Forced Sterilization Victims, 25 July 2013
    url: https://www.npr.org/sections/thetwo-way/2013/07/25/205547272/north-carolina-set-to-compensate-forced-sterilization-victims
    locator: Compensation fund
  verified_by: null
  verified_at: null
