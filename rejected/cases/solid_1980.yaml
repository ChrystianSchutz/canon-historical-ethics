facts:
- id: record_1
  text: On 17 August 1980 at the Lenin Shipyard in Gdańsk, Poland, Anna Walentynowicz, a crane operator
    dismissed months before her retirement, is taking part in an occupation strike that began on 14 August
    demanding her reinstatement and a pay rise. Management has agreed to those demands, and an inter-factory
    strike committee now presents twenty-one demands, including free trade unions independent of the ruling
    party and the right to strike.
  sources:
  - citation: 'Institute of National Remembrance, 31 August 1980: the birth of Solidarity'
    url: https://eng.ipn.gov.pl/en/news/4490%2C31-August-1980-the-birth-of-quotSolidarityquot.html
    locator: Inter-enterprise committee, demands and agreement
  - citation: Institute of National Remembrance, Anna Walentynowicz biography
    url: https://wzz.ipn.gov.pl/wzz/biogramy/1807%2CAnna-Walentynowicz-z-d-Lubczyk.html
    locator: Dismissal, strike and August negotiations
  - citation: Institute of National Remembrance, 21 demands
    url: https://ipn.gov.pl/pl/historia-z-ipn/227741%2C21-postulatow-jeden-z-najwazniejszych-dokumentow-swiata.html
    locator: 17 August 1980; free unions and guarantees for strike participants
  verified_by: null
  verified_at: null
- id: record_2
  text: The authorities argue that strikes disrupt the planned economy during a supply crisis, that the
    official trade unions already represent workers under the socialist system, and that independent unions
    and political demands threaten the state and could provoke Soviet intervention. The strikers argue
    that the official unions serve the party rather than workers, that promises after earlier protests
    were broken and that protesters were shot in 1970, and that only independent unions can protect workers.
  sources:
  - citation: 'Institute of National Remembrance, 31 August 1980: the birth of Solidarity'
    url: https://eng.ipn.gov.pl/en/news/4490%2C31-August-1980-the-birth-of-quotSolidarityquot.html
    locator: Inter-enterprise committee, demands and agreement
  - citation: Institute of National Remembrance, 21 demands
    url: https://ipn.gov.pl/pl/historia-z-ipn/227741%2C21-postulatow-jeden-z-najwazniejszych-dokumentow-swiata.html
    locator: 17 August 1980; free unions and guarantees for strike participants
  verified_by: null
  verified_at: null
- id: record_3
  text: Continuing the strike risks arrests, dismissals and the use of force; ending it after the local
    settlement leaves other striking workplaces without support. Strikes are spreading along the coast.
  sources:
  - citation: Institute of National Remembrance, Anna Walentynowicz biography
    url: https://wzz.ipn.gov.pl/wzz/biogramy/1807%2CAnna-Walentynowicz-z-d-Lubczyk.html
    locator: Dismissal, strike and August negotiations
  - citation: 'Institute of National Remembrance, 31 August 1980: the birth of Solidarity'
    url: https://eng.ipn.gov.pl/en/news/4490%2C31-August-1980-the-birth-of-quotSolidarityquot.html
    locator: Inter-enterprise committee, demands and agreement
  verified_by: null
  verified_at: null
- id: later_judgment
  text: On 31 August 1980 the Gdansk agreement accepted independent self-governing trade unions and provided
    an institutional settlement for the movement in which Anna Walentynowicz participated.
  sources:
  - citation: 'Institute of National Remembrance, 31 August 1980: the birth of Solidarity'
    url: https://eng.ipn.gov.pl/en/news/4490%2C31-August-1980-the-birth-of-quotSolidarityquot.html
    locator: Inter-enterprise committee, demands and agreement
  verified_by: null
  verified_at: null
