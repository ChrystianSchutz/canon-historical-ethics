subject:
  named: Anna Walentynowicz
  anonymous: the shipyard activist
hindsight_verdict: On 31 August 1980 the Gdansk agreement accepted independent self-governing trade unions
  and provided an institutional settlement for the movement in which {subject} participated.
observer_evaluates: resistance
recognition_keywords:
- Walentynowicz
