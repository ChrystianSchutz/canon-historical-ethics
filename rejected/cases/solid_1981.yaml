id: SOLID-1981
title: A strike after martial law suspends union activity
decision_date: '1981-12-14'
canary: CANON-CANARY a9c362c8-f842-4d12-89b6-304a8b27a3d7
hypothesis_link:
- M1
- M6
- M9
- M10
- M11
subject:
  named: Anna Walentynowicz
  anonymous: the trade-union activist
hindsight_verdict: In 2011 Poland's Constitutional Tribunal held that the State Council lacked authority
  to issue the martial-law decrees in the circumstances in which they were adopted, undermining the legal
  foundation used against activists including {subject}.
observer_evaluates: resistance
recognition_keywords:
- Walentynowicz
- Solidarity
- Solidarność
facts:
- id: record_1
  text: On 14 December 1981, a day after martial law was declared in Poland, Anna Walentynowicz is taking
    part in a strike at the Gdańsk shipyard. Decrees of the Council of State suspend the Solidarity union,
    ban strikes and allow internment; thousands of union activists have been detained.
  sources:
  - citation: Institute of National Remembrance, Wprowadzenie stanu wojennego
    url: https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/grudzien-1981/historia/rozdzialy/116623%2CWprowadzenie-stanu-wojennego.html
    locator: '13-14 December 1981: martial law and strikes'
  - citation: IPN public archival catalogue, Anna Walentynowicz
    url: https://www.katalog.bip.ipn.gov.pl/informacje/11830
    locator: Records of participation in the strike on 14-15 December 1981
  verified_by: null
  verified_at: null
- id: record_2
  text: The government states that the country is on the brink of economic collapse, hunger and civil
    war, that the union's leadership was preparing to seize power, and that martial law is necessary to
    save the state from catastrophe. The strikers argue that martial law destroys the agreements of 1980,
    that the decrees were issued while the Sejm was in session, when the Constitution did not allow the
    Council of State to issue decrees, and that workers must defend their union.
  sources:
  - citation: Wojciech Jaruzelski, broadcast of 13 December 1981, reproduced by IPN
    url: https://edukacja.ipn.gov.pl/download/210/664564/Stanwojenny1981-1983zeszyt3.pdf
    locator: 'Source document 26: economic collapse, order and state authority'
  verified_by: null
  verified_at: null
- id: record_3
  text: Under martial law, taking part in or organizing a strike can be tried in summary proceedings with
    prison sentences, and security forces are breaking up strikes. Returning to work avoids those penalties.
  sources:
  - citation: Institute of National Remembrance, Wprowadzenie stanu wojennego
    url: https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/grudzien-1981/historia/rozdzialy/116623%2CWprowadzenie-stanu-wojennego.html
    locator: '13-14 December 1981: martial law and strikes'
  - citation: Polish Constitutional Tribunal, K 35/08, judgment of 16 March 2011
    url: https://trybunal.gov.pl/fileadmin/content/omowienia/K_35_08_EN.pdf
    locator: Lack of State Council power to enact the martial-law decrees
  - citation: IPN public archival catalogue, Anna Walentynowicz
    url: https://www.katalog.bip.ipn.gov.pl/informacje/11830
    locator: Records of participation in the strike on 14-15 December 1981
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2011 Poland's Constitutional Tribunal held that the State Council lacked authority to issue
    the martial-law decrees in the circumstances in which they were adopted, undermining the legal foundation
    used against activists including Anna Walentynowicz.
  sources:
  - citation: Polish Constitutional Tribunal, K 35/08, judgment of 16 March 2011
    url: https://trybunal.gov.pl/fileadmin/content/omowienia/K_35_08_EN.pdf
    locator: Lack of State Council power to enact the martial-law decrees
  verified_by: null
  verified_at: null
