subject:
  named: Taylor Strauder
  anonymous: the defendant
hindsight_verdict: In 1986 the Supreme Court held that prosecutors may not use peremptory challenges to
  exclude jurors because of their race, extending the principle against racial exclusion from juries invoked
  by {subject}.
observer_evaluates: enforcement
recognition_keywords:
- Strauder
facts:
- id: record_1
  text: The Supreme Court is reviewing the murder conviction of Taylor Strauder, a Black man tried in
    West Virginia. A state statute of 1873 makes only white male citizens eligible to serve on juries.
    Before trial he petitioned to remove the case to federal court on the ground that Black citizens were
    excluded by law from his jury, and the state court refused.
  sources:
  - citation: Strauder v. West Virginia, 100 U.S. 303 (1880), opinion
    url: https://supreme.justia.com/cases/federal/us/100/303/
    locator: '304-312: murder charge, jury statute, removal and disposition'
  verified_by: null
  verified_at: null
- id: record_2
  text: West Virginia argues that states control the qualifications of jurors, that the Fourteenth Amendment
    does not guarantee a defendant a jury that includes members of his race, and that he received a trial
    under the ordinary laws of the state for a serious crime. The defendant argues that a law excluding
    all Black citizens from juries denies him the equal protection of the laws.
  sources:
  - citation: Strauder v. West Virginia, 100 U.S. 303 (1880), opinion
    url: https://supreme.justia.com/cases/federal/us/100/303/
    locator: '304-312: murder charge, jury statute, removal and disposition'
  verified_by: null
  verified_at: null
- id: record_3
  text: The Court can affirm the conviction, or reverse and remand, which would require a new proceeding
    before a jury selected without the racial exclusion; the murder charge would remain.
  sources:
  - citation: Strauder v. West Virginia, 100 U.S. 303 (1880), opinion
    url: https://supreme.justia.com/cases/federal/us/100/303/
    locator: '304-312: murder charge, jury statute, removal and disposition'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1986 the Supreme Court held that prosecutors may not use peremptory challenges to exclude jurors
    because of their race, extending the principle against racial exclusion from juries invoked by Taylor
    Strauder.
  sources:
  - citation: Batson v. Kentucky, 476 U.S. 79 (1986)
    url: https://www.law.cornell.edu/supremecourt/text/476/79
    locator: Opinion of the Court
  verified_by: null
  verified_at: null
