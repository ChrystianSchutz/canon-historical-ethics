  named: Wong Wing
  anonymous: the detained Chinese national
hindsight_verdict: In 2012 the House of Representatives unanimously expressed regret for the Chinese Exclusion
  Act and later laws that adversely affected Chinese people in the United States, including the legislation
  applied to {subject}.
observer_evaluates: enforcement
