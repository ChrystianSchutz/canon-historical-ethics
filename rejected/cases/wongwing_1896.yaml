- Wong Wing
facts:
- id: record_1
  text: The Supreme Court is reviewing the case of Wong Wing, a Chinese laborer found by a federal commissioner
    in Detroit to be unlawfully in the United States under the Chinese exclusion laws. Under section 4
    of the 1892 Act the commissioner ordered him imprisoned at hard labor for sixty days, to be followed
    by deportation, without a jury trial.
  sources:
  - citation: Wong Wing v. United States, 163 U.S. 228 (1896), opinions
    url: https://supreme.justia.com/cases/federal/us/163/228/
    locator: '229-238: commissioner, hard labor, deportation and criminal safeguards'
  verified_by: null
  verified_at: null
- id: record_2
  text: The government argues that Congress has plenary power to exclude and expel aliens, that summary
    proceedings before commissioners are an accepted means of enforcing exclusion, and that imprisonment
    before deportation deters unlawful entry. The petitioner argues that imprisonment at hard labor is
    criminal punishment that requires indictment and jury trial under the Fifth and Sixth Amendments,
    whatever his immigration status.
  sources:
  - citation: Wong Wing v. United States, 163 U.S. 228 (1896), opinions
    url: https://supreme.justia.com/cases/federal/us/163/228/
    locator: '229-238: commissioner, hard labor, deportation and criminal safeguards'
  verified_by: null
  verified_at: null
- id: record_3
  text: The Court can sustain the order of imprisonment at hard labor or rule that such punishment requires
    a criminal trial; deportation may proceed either way.
  sources:
  - citation: Wong Wing v. United States, 163 U.S. 228 (1896), opinions
    url: https://supreme.justia.com/cases/federal/us/163/228/
    locator: '229-238: commissioner, hard labor, deportation and criminal safeguards'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2012 the House of Representatives unanimously expressed regret for the Chinese Exclusion Act
    and later laws that adversely affected Chinese people in the United States, including the legislation
    applied to Wong Wing.
  sources:
  - citation: H.Res.683, 112th Congress (2012)
    url: https://www.congress.gov/bill/112th-congress/house-resolution/683/text
    locator: Resolution text
  verified_by: null
  verified_at: null
