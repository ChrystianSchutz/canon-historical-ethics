subject:
  named: Lee Yick
  anonymous: the laundry operator
hindsight_verdict: In 2012 the House of Representatives unanimously expressed regret for laws that adversely
  affected Chinese people in the United States during the exclusion era, the period in which the ordinance
  was enforced against {subject}.
observer_evaluates: enforcement
recognition_keywords:
- Yick Wo
facts:
- id: record_1
  text: The Supreme Court is reviewing the imprisonment of Lee Yick, a Chinese immigrant who has operated
    a laundry in San Francisco for twenty-two years, for violating a city ordinance that forbids operating
    a laundry in a wooden building without the consent of the Board of Supervisors. He was fined ten dollars
    and jailed for not paying.
  sources:
  - citation: Yick Wo v. Hopkins, 118 U.S. 356 (1886), opinion and record
    url: https://supreme.justia.com/cases/federal/us/118/356/
    locator: '357-374: permits, safety inspection, comparative administration'
  verified_by: null
  verified_at: null
- id: record_2
  text: The city argues that laundries in wooden buildings pose a serious fire risk in a crowded city
    of wooden structures, and that the supervisors must have discretion to grant or refuse consent. The
    petitioner shows that his premises passed fire and health inspections and that about two hundred Chinese
    applicants were refused consent while nearly all of some eighty non-Chinese applicants received it,
    and argues that the ordinance is administered to drive Chinese laundries out of business.
  sources:
  - citation: Yick Wo v. Hopkins, 118 U.S. 356 (1886), opinion and record
    url: https://supreme.justia.com/cases/federal/us/118/356/
    locator: '357-374: permits, safety inspection, comparative administration'
  verified_by: null
  verified_at: null
- id: record_3
  text: The Court can sustain his detention under the ordinance or order his release.
  sources:
  - citation: Yick Wo v. Hopkins, 118 U.S. 356 (1886), opinion and record
    url: https://supreme.justia.com/cases/federal/us/118/356/
    locator: '357-374: permits, safety inspection, comparative administration'
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 2012 the House of Representatives unanimously expressed regret for laws that adversely affected
    Chinese people in the United States during the exclusion era, the period in which the ordinance was
    enforced against Lee Yick.
  sources:
  - citation: H.Res.683, 112th Congress (2012)
    url: https://www.congress.gov/bill/112th-congress/house-resolution/683/text
    locator: Resolution text
  verified_by: null
  verified_at: null
