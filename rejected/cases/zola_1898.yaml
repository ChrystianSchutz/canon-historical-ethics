facts:
- id: record_1
  text: In January 1898 in Paris, Émile Zola, a celebrated novelist, is about to publish an open letter
    to the President of the Republic. It accuses named generals and officers of knowingly convicting an
    innocent Jewish officer, Alfred Dreyfus, of treason in 1894 and of arranging the acquittal on 11 January
    of the officer the letter names as the real author of the treasonous document.
  sources:
  - citation: 'French National Assembly, 1894-1906: L''affaire Dreyfus'
    url: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/troisieme-republique/l-affaire-dreyfus
    locator: 13 January 1898 letter, criminal libel, military evidence and 1906 judgment
  - citation: Emile Zola, J'accuse, L'Aurore, 13 January 1898
    url: https://fr.wikisource.org/wiki/J%E2%80%99accuse%E2%80%A6_!
    locator: Letter's accusations and explicit acceptance of prosecution under the press law
  verified_by: null
  verified_at: null
- id: record_2
  text: The army and government argue that the verdicts of two courts-martial must be respected, that
    reopening the case would expose military secrets and damage the army's authority while Germany is
    a threat, and that accusations against named officers are defamation. Supporters of revision argue
    that the conviction relied on secret evidence withheld from the defense and that new evidence points
    to another officer.
  sources:
  - citation: 'French National Assembly, 1894-1906: L''affaire Dreyfus'
    url: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/troisieme-republique/l-affaire-dreyfus
    locator: 13 January 1898 letter, criminal libel, military evidence and 1906 judgment
  - citation: Emile Zola, J'accuse, L'Aurore, 13 January 1898
    url: https://fr.wikisource.org/wiki/J%E2%80%99accuse%E2%80%A6_!
    locator: Letter's accusations and explicit acceptance of prosecution under the press law
  verified_by: null
  verified_at: null
- id: record_3
  text: Publication exposes him to prosecution for criminal libel, with fines and imprisonment, and to
    hostility from much of the press and public. He can instead keep petitioning the authorities privately.
  sources:
  - citation: Emile Zola, J'accuse, L'Aurore, 13 January 1898
    url: https://fr.wikisource.org/wiki/J%E2%80%99accuse%E2%80%A6_!
    locator: Letter's accusations and explicit acceptance of prosecution under the press law
  - citation: 'French National Assembly, 1894-1906: L''affaire Dreyfus'
    url: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/troisieme-republique/l-affaire-dreyfus
    locator: 13 January 1898 letter, criminal libel, military evidence and 1906 judgment
  verified_by: null
  verified_at: null
- id: later_judgment
  text: In 1906 the Court of Cassation annulled the treason conviction without a retrial and recognized
    that it had been imposed in error, vindicating the central challenge supported by Émile Zola.
  sources:
  - citation: 'French National Assembly, 1894-1906: L''affaire Dreyfus'
    url: https://www.assemblee-nationale.fr/dyn/histoire-et-patrimoine/troisieme-republique/l-affaire-dreyfus
    locator: 13 January 1898 letter, criminal libel, military evidence and 1906 judgment
  verified_by: null
  verified_at: null
